<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aerdorn Map Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0804; color: #c4b590; font-family: Georgia, serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#topbar { background: #161008; border-bottom: 1px solid #3a2a10; padding: 5px 10px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
#topbar h1 { font-size: 13px; color: #e8c870; letter-spacing: 2px; white-space: nowrap; }
select, input[type=text] { background: #0f0c06; border: 1px solid #3a2a10; color: #c4b590; padding: 3px 6px; font-size: 11px; border-radius: 3px; font-family: Georgia, serif; }
button { background: #1a1208; border: 1px solid #3a2a10; color: #a08050; padding: 3px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; white-space: nowrap; }
button:hover { background: #2a1e08; border-color: #6a4820; }
button.active { background: #3a2808; border-color: #e8c870; color: #e8c870; }
button.save-btn { background: linear-gradient(180deg,#3a6018,#204010); border-color: #5a8028; color: #90c050; }
button.save-btn:hover { border-color: #8ac060; color: #b0e070; }
.sep { width: 1px; height: 18px; background: #2a1e10; margin: 0 2px; flex-shrink: 0; }
#main { display: flex; flex: 1; overflow: hidden; }

/* LEFT PANEL */
#left-panel { width: 175px; min-width: 175px; background: #0f0c08; border-right: 1px solid #2a1e10; display: flex; flex-direction: column; overflow: hidden; }
.psec { border-bottom: 1px solid #2a1e10; padding: 6px; flex-shrink: 0; }
.plabel { font-size: 10px; letter-spacing: 2px; color: #5a4820; margin-bottom: 4px; }
.pscroll { overflow-y: auto; }
.pgrid { display: flex; flex-direction: column; gap: 1px; padding: 4px; }
.pitem { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 11px; border: 1px solid transparent; user-select: none; }
.pitem:hover { background: #1a1208; }
.pitem.sel { background: #2a1a08; border-color: #e8c870; color: #e8c870; }
.swatch { width: 16px; height: 16px; border-radius: 2px; border: 1px solid #3a2a10; flex-shrink: 0; overflow: hidden; }
.swatch canvas { display: block; width: 16px !important; height: 16px !important; image-rendering: pixelated; }
.cat-label { font-size: 10px; color: #4a3818; padding: 4px 4px 1px; letter-spacing: 1px; border-top: 1px solid #1a1208; margin-top: 2px; }

/* CANVAS */
#canvas-wrap { flex: 1; overflow: auto; background: #080602; display: flex; align-items: flex-start; justify-content: flex-start; padding: 8px; }
#grid-canvas { image-rendering: pixelated; cursor: crosshair; display: block; }

/* RIGHT PANEL */
#right-panel { width: 200px; min-width: 200px; background: #0f0c08; border-left: 1px solid #2a1e10; display: flex; flex-direction: column; overflow-y: auto; }
.cprop { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.cprop label { font-size: 10px; color: #6a5030; }
.cprop input, .cprop select { width: 100%; }
#cell-coords { font-size: 11px; color: #8a7050; margin-bottom: 6px; min-height: 14px; }
#export-box { background: #0a0806; border: 1px solid #2a1e10; border-radius: 3px; padding: 5px; font-size: 10px; font-family: monospace; color: #90a878; white-space: pre; overflow-x: auto; min-height: 40px; max-height: 160px; overflow-y: auto; }
#export-box:empty::before { content: '// No changes yet'; color: #3a2a10; }
</style>
</head>
<body>
<div id="topbar">
  <h1>&#9874; MAP EDITOR</h1>
  <div class="sep"></div>
  <select id="mode-select">
    <option value="settlement">Settlement</option>
    <option value="overworld">Overworld</option>
    <option value="interior">Interior</option>
  </select>
  <select id="settlement-select"></select>
  <select id="interior-select" style="display:none"></select>
  <div class="sep"></div>
  <label style="font-size:10px;color:#6a5030">Zoom:</label>
  <select id="zoom-select">
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="6">6x</option>
    <option value="8">8x</option>
    <option value="12">12x</option>
    <option value="16">16x</option>
    <option value="24" selected>24x</option>
    <option value="32">32x</option>
    <option value="48">48x</option>
  </select>
  <div class="sep"></div>
  <button id="tool-paint" class="active" data-tool="paint">&#9999; Paint</button>
  <button id="tool-fill"  data-tool="fill">&#9632; Fill</button>
  <button id="tool-erase" data-tool="erase">&#10005; Erase</button>
  <button id="tool-pick"  data-tool="pick">&#9677; Pick</button>
  <div class="sep"></div>
  <button id="btn-undo">&#8617; Undo</button>
  <div class="sep"></div>
  <button id="btn-save" class="save-btn">&#128190; Save to Game</button>
  <button id="btn-copy-diff">&#128203; Diff</button>
  <button id="btn-export-full">&#8595; Full JS</button>
  <span id="status-msg" style="font-size:11px;color:#5a7840;margin-left:4px;"></span>
</div>
<div id="main">

  <!-- LEFT: terrain + object palettes -->
  <div id="left-panel">
    <div class="psec" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
      <div class="plabel" id="terrain-label">TERRAIN</div>
      <div class="pscroll" style="flex:0 0 auto;max-height:45%;"><div class="pgrid" id="terrain-palette"></div></div>
      <div class="plabel" style="margin-top:6px;flex-shrink:0;">OBJECT</div>
      <div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:3px;flex-shrink:0;" id="obj-cat-tabs"></div>
      <div class="pscroll" style="flex:1;"><div class="pgrid" id="obj-palette"></div></div>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap"><canvas id="grid-canvas"></canvas></div>

  <!-- RIGHT: inspector + export -->
  <div id="right-panel">
    <div class="psec">
      <div class="plabel">CELL</div>
      <div id="cell-coords">-</div>
      <div class="cprop"><label>Type</label><input id="prop-type" type="text"></div>
      <div class="cprop"><label>Name</label><input id="prop-name" type="text"></div>
      <div class="cprop"><label>interiorType</label><input id="prop-interiorType" type="text"></div>
      <div class="cprop"><label>doors (comma-sep)</label><input id="prop-doors" type="text" placeholder="north,east..."></div>
      <div class="cprop"><label>object</label><input id="prop-object" type="text"></div>
      <button id="btn-apply" style="width:100%;margin-top:3px;">&#10004; Apply</button>
      <div style="margin-top:8px;font-size:10px;color:#5a4820;line-height:1.6;">
        <b style="color:#8a7050">Terrain</b> changes the cell type.<br>
        <b style="color:#8a7050">Object</b> overlays a sprite on top.<br>
        Selecting an object alone won't change terrain.
      </div>
    </div>
    <div class="psec" style="flex:1;padding-bottom:10px;">
      <div class="plabel">EXPORT DIFF</div>
      <div id="export-box"></div>
      <div style="display:flex;gap:4px;margin-top:5px;">
        <button id="btn-dl-diff" style="flex:1">&#8595; DL</button>
        <button id="btn-cp-diff" style="flex:1">&#128203; Copy</button>
      </div>
    </div>
  </div>
</div>

<script src="mapforge.js"></script>
<script src="worlds/aerdorn.js"></script>

// ── Key parsing ────────────────────────────────────────────────
function parseKey(k) {
  const ci = k.lastIndexOf(',');
  return [parseInt(k.slice(0,ci),10), parseInt(k.slice(ci+1),10)];
}

// ── Infer background terrain for any cell ─────────────────────
function inferBg(x, y) {
  if (editorMode === 'overworld') {
    const meta = window.WORLD_DATA.meta[`${x},${y}`];
    if (meta) return meta;
    if (window.WORLD_DATA.inferTerrain) return window.WORLD_DATA.inferTerrain(x,y);
    return {type:'plains',name:''};
  }
  if (editorMode === 'settlement') return {type:'courtyard',name:''};
  return {type:'interior',name:''};
}

// ── Build full display map (defined + background for every cell in bounds) ──
function buildDisplayMap(minX,maxX,minY,maxY) {
  const dm = {};
  for (let x=minX; x<=maxX; x++) {
    for (let y=minY; y<=maxY; y++) {
      const k = `${x},${y}`;
      dm[k] = definedMap[k] ? Object.assign({},definedMap[k]) : inferBg(x,y);
    }
  }
  return dm;
}

// ── Load layer ─────────────────────────────────────────────────
function loadLayer() {
  undoStack=[]; selectedCell=null; tileCache.clear(); objCache.clear();
  definedMap = {};
  originalMap = {};

  if (editorMode === 'settlement') {
    const s = window.WORLD_DATA && window.WORLD_DATA.settlements[settlementId];
    if (!s) { statusMsg('Unknown settlement'); return; }
    for (const [k,v] of Object.entries(s.map)) {
      definedMap[k] = Object.assign({},v);
      originalMap[k] = Object.assign({},v);
    }
    console.log('[Editor] Settlement', settlementId, 'defined keys:', Object.keys(definedMap).length);

  } else if (editorMode === 'overworld') {
    // Load all defined overworld cells
    for (const [k,v] of Object.entries(window.WORLD_DATA.meta || {})) {
      definedMap[k] = Object.assign({},v);
      originalMap[k] = Object.assign({},v);
    }
    console.log('[Editor] Overworld defined keys:', Object.keys(definedMap).length);

  } else {
    // Interior
    const stored = INTERIOR_STORE[interiorId];
    if (stored) {
      for (const [k,v] of Object.entries(stored)) {
        definedMap[k]=Object.assign({},v); originalMap[k]=Object.assign({},v);
      }
    } else {
      // Blank 14x12
      for (let x=0;x<=13;x++) for (let y=0;y<=11;y++) {
        const v = (x===0||x===13||y===0||y===11) ? {type:'wall',name:'Wall'} : {type:'interior',name:'Floor'};
        definedMap[`${x},${y}`]=Object.assign({},v); originalMap[`${x},${y}`]=Object.assign({},v);
      }
      definedMap['6,0']={type:'door',name:'Entrance'}; originalMap['6,0']={type:'door',name:'Entrance'};
    }
  }

  computeBounds();
  map = buildDisplayMap(bounds.minX, bounds.maxX, bounds.minY, bounds.maxY);
  renderAll(); clearInspector(); updateExport();
}

const INTERIOR_STORE = {};

// ── Bounds ─────────────────────────────────────────────────────
let bounds = {minX:0,maxX:0,minY:0,maxY:0};
function computeBounds() {
  if (editorMode === 'overworld') {
    bounds = Object.assign({},OW_BOUNDS);
    return;
  }
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (const k of Object.keys(definedMap)) {
    const [x,y]=parseKey(k);
    if(isNaN(x)||isNaN(y))continue;
    if(x<mnX)mnX=x;if(x>mxX)mxX=x;if(y<mnY)mnY=y;if(y>mxY)mxY=y;
  }
  if(!isFinite(mnX)){bounds={minX:0,maxX:10,minY:0,maxY:10};return;}
  const pad=2;
  bounds={minX:mnX-pad,maxX:mxX+pad,minY:mnY-pad,maxY:mxY+pad};
  console.log('[Editor] Bounds',bounds,'grid',gridW(),'x',gridH());
}
function gridW(){return bounds.maxX-bounds.minX+1;}
function gridH(){return bounds.maxY-bounds.minY+1;}
function cellToCanvas(x,y){return{px:(x-bounds.minX)*tileSize,py:(gridH()-1-(y-bounds.minY))*tileSize};}
function canvasToCell(px,py){return{x:Math.floor(px/tileSize)+bounds.minX,y:(gridH()-1-Math.floor(py/tileSize))+bounds.minY};}
function inBounds(x,y){return x>=bounds.minX&&x<=bounds.maxX&&y>=bounds.minY&&y<=bounds.maxY;}

// ── Sprite rendering ───────────────────────────────────────────
function getTileCanvas(type, x, y) {
  const mf = TERRAIN_TO_MF[type]||'grass';
  const seed = ((x&0xffff)<<16)|(y&0xffff);
  const key = mf+'_'+seed;
  if(tileCache.has(key))return tileCache.get(key);
  const grid = MF.makeTerrain(mf,seed,{});
  const c = document.createElement('canvas');
  MF.renderGridToCanvas(grid,c,1);
  tileCache.set(key,c); return c;
}

function getObjCanvas(objId, seed) {
  const item = OBJ_CATS.flatMap(c=>c.items).find(i=>i.id===objId);
  if(!item||!item.fn)return null;
  const key = objId+'_'+seed;
  if(objCache.has(key))return objCache.get(key);
  let grid;
  try{ grid=item.fn(seed); }catch(e){return null;}
  if(!grid)return null;
  const c=document.createElement('canvas');
  MF.renderGridToCanvas(grid,c,1);
  objCache.set(key,c); return c;
}

function getBldgCanvas(meta, seed) {
  if(!MF.ROOF_STYLES||!MF.ROOF_STYLES.length)return null;
  const styleId = BLDG_STYLE[meta.interiorType]||BLDG_STYLE.default;
  const key = 'roof_'+styleId+'_'+seed;
  if(objCache.has(key))return objCache.get(key);
  const style = MF.ROOF_STYLES.find(s=>s.id===styleId)||MF.ROOF_STYLES[0];
  if(!style)return null;
  const shapes=['hip','ridge','pyramid','gambrel'];
  const shape=shapes[seed%shapes.length];
  let grid=null;
  try{
    const chimneys=MF.autoChimneys?MF.autoChimneys(20,20,seed%3===0?1:0):[];
    grid=style.isThatch?MF.makeThatchRoof(20,20,shape,chimneys,seed):MF.makeRoofByShape(20,20,shape,style,chimneys,seed);
  }catch(e){return null;}
  if(!grid)return null;
  const c=document.createElement('canvas');
  MF.renderGridToCanvas(grid,c,1);
  objCache.set(key,c); return c;
}

// ── Canvas ─────────────────────────────────────────────────────
const canvas=document.getElementById('grid-canvas');
const ctx=canvas.getContext('2d');
const ALL_T=[...SETTLE_TERRAIN,...OW_TERRAIN,...INT_TERRAIN];

function renderAll() {
  canvas.width=gridW()*tileSize; canvas.height=gridH()*tileSize;
  ctx.fillStyle='#050402'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(const[k,meta]of Object.entries(map)){
    const[x,y]=parseKey(k); if(!isNaN(x))_drawCell(x,y,meta);
  }
  if(selectedCell)_drawSel(selectedCell.x,selectedCell.y);
}

function _drawCell(x,y,meta){
  const{px,py}=cellToCanvas(x,y);
  const tc=getTileCanvas(meta.type,x,y);
  if(tc)ctx.drawImage(tc,px,py,tileSize,tileSize);
  else{ctx.fillStyle='#1a1408';ctx.fillRect(px,py,tileSize,tileSize);}

  // Object overlay (transparent — only non-null pixels drawn)
  if(tileSize>=8){
    const seed=(((x&0xffff)<<16)|(y&0xffff))>>>0;
    let oc=null;
    if(meta.object)oc=getObjCanvas(meta.object,seed);
    else if(meta.type==='building')oc=getBldgCanvas(meta,seed);
    if(oc)ctx.drawImage(oc,px,py,tileSize,tileSize);
  }

  // Settlement/city dot on overworld
  if(editorMode==='overworld'&&(meta.type==='town'||meta.type==='city'||meta.type==='village'||meta.type==='castle')){
    ctx.fillStyle='#e8c870cc';const sz=Math.max(2,tileSize/4);
    ctx.fillRect(px+tileSize/2-sz/2,py+tileSize/2-sz/2,sz,sz);
  }
  // Type border (only at useful zoom levels)
  if(tileSize>=12){
    const ti=ALL_T.find(t=>t.id===meta.type);
    if(ti){ctx.strokeStyle=ti.c+'33';ctx.lineWidth=0.5;ctx.strokeRect(px+0.5,py+0.5,tileSize-1,tileSize-1);}
  }
}

function _drawSel(x,y){
  const{px,py}=cellToCanvas(x,y);
  ctx.strokeStyle='#e8c870';ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,tileSize-2,tileSize-2);
}

function redrawCell(x,y){
  const{px,py}=cellToCanvas(x,y);
  ctx.fillStyle='#050402';ctx.fillRect(px,py,tileSize,tileSize);
  const meta=map[`${x},${y}`];if(meta)_drawCell(x,y,meta);
  if(selectedCell&&selectedCell.x===x&&selectedCell.y===y)_drawSel(x,y);
}

// ── Edit ops ───────────────────────────────────────────────────
function pushUndo(x,y){
  const k=`${x},${y}`;
  // Save both the display map entry and whether it was in definedMap
  undoStack.push({k, dispPrev:map[k]?Object.assign({},map[k]):null, defPrev:definedMap[k]?Object.assign({},definedMap[k]):null});
  if(undoStack.length>400)undoStack.shift();
}

function applyPaint(x,y){
  if(!inBounds(x,y))return;
  const k=`${x},${y}`;

  if(currentTool==='erase'){
    if(!definedMap[k])return;
    pushUndo(x,y);
    delete definedMap[k];
    map[k]=inferBg(x,y); // revert to background
  } else {
    // Get current cell state — defined or background
    const existing = definedMap[k] ? Object.assign({},definedMap[k]) : Object.assign({},inferBg(x,y));

    // Only update terrain if paintTerrain is true (terrain palette was used last)
    if(paintTerrain) existing.type = currentTerrainId;

    // Object handling
    if(currentObjId==='')delete existing.object;
    else if(currentObjId!==null)existing.object=currentObjId;

    pushUndo(x,y);
    definedMap[k]=existing;
    map[k]=existing;
  }
  redrawCell(x,y);
  updateExport();
}

function floodFill(startX,startY){
  if(!inBounds(startX,startY))return;
  const startMeta = map[`${startX},${startY}`]||{};
  const targetType = startMeta.type||null;
  const visited=new Set();
  const queue=[[startX,startY]];
  visited.add(`${startX},${startY}`);
  while(queue.length){
    const[cx,cy]=queue.shift();
    // Apply same logic as paint
    const existing=definedMap[`${cx},${cy}`]?Object.assign({},definedMap[`${cx},${cy}`]):Object.assign({},inferBg(cx,cy));
    if(paintTerrain)existing.type=currentTerrainId;
    if(currentObjId==='')delete existing.object;
    else if(currentObjId!==null)existing.object=currentObjId;
    pushUndo(cx,cy);
    definedMap[`${cx},${cy}`]=existing;
    map[`${cx},${cy}`]=existing;
    redrawCell(cx,cy);
    for(const[nx,ny]of[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]]){
      const nk=`${nx},${ny}`;
      if(visited.has(nk)||!inBounds(nx,ny))continue;
      const nm=map[nk]; const nt=nm?nm.type:null;
      if(nt===targetType){visited.add(nk);queue.push([nx,ny]);}
    }
  }
  updateExport();
}

function undo(){
  if(!undoStack.length)return;
  const{k,dispPrev,defPrev}=undoStack.pop();
  const[x,y]=parseKey(k);
  if(defPrev)definedMap[k]=defPrev; else delete definedMap[k];
  map[k]=dispPrev||inferBg(x,y);
  redrawCell(x,y);
  if(selectedCell&&selectedCell.x===x&&selectedCell.y===y)populateInspector(x,y);
  updateExport(); statusMsg('Undone.');
}

// ── Inspector ─────────────────────────────────────────────────
function selectCell(x,y){
  if(selectedCell){const o=selectedCell;selectedCell=null;redrawCell(o.x,o.y);}
  selectedCell={x,y}; redrawCell(x,y); populateInspector(x,y);
}
function populateInspector(x,y){
  const meta=map[`${x},${y}`]||{};
  const isDefined=!!definedMap[`${x},${y}`];
  document.getElementById('cell-coords').textContent=`x=${x}, y=${y}  ${isDefined?'':'(bg)'}(${meta.type||'?'})`;
  document.getElementById('prop-type').value=meta.type||'';
  document.getElementById('prop-name').value=meta.name||'';
  document.getElementById('prop-interiorType').value=meta.interiorType||'';
  document.getElementById('prop-doors').value=Array.isArray(meta.doors)?meta.doors.join(','):(meta.doors||'');
  document.getElementById('prop-object').value=meta.object||'';
}
function clearInspector(){
  document.getElementById('cell-coords').textContent='-';
  ['prop-type','prop-name','prop-interiorType','prop-doors','prop-object'].forEach(id=>document.getElementById(id).value='');
}
document.getElementById('btn-apply').addEventListener('click',()=>{
  if(!selectedCell)return;
  const{x,y}=selectedCell; const k=`${x},${y}`;
  pushUndo(x,y);
  const type=document.getElementById('prop-type').value.trim();
  const name=document.getElementById('prop-name').value.trim();
  const it=document.getElementById('prop-interiorType').value.trim();
  const ds=document.getElementById('prop-doors').value.trim();
  const obj=document.getElementById('prop-object').value.trim();
  const meta={};
  if(type)meta.type=type; if(name)meta.name=name; if(it)meta.interiorType=it;
  if(ds)meta.doors=ds.split(',').map(s=>s.trim()).filter(Boolean);
  if(obj)meta.object=obj;
  const seed=(((x&0xffff)<<16)|(y&0xffff))>>>0;
  for(const ck of[...objCache.keys()]){if(ck.includes('_'+seed))objCache.delete(ck);}
  definedMap[k]=meta; map[k]=meta;
  redrawCell(x,y); updateExport(); statusMsg('Applied.');
});

// ── Export ─────────────────────────────────────────────────────
function cellToJS(k,meta){
  const[x,y]=parseKey(k);
  const ex={};
  if(meta.interiorType)ex.interiorType=meta.interiorType;
  if(meta.doors&&meta.doors.length)ex.doors=meta.doors;
  if(meta.object)ex.object=meta.object;
  const es=Object.keys(ex).length?', '+JSON.stringify(ex).replace(/"(\w+)":/g,'$1:'):'';
  const n=(meta.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `t(${x},${y},'${meta.type||''}','${n}'${es});`;
}
function cellToOWJS(k,meta){
  const[x,y]=parseKey(k);
  const n=(meta.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `defCell(${x},${y},'${meta.type||''}','${n}');`;
}

function buildDiff(){
  const adds=[],removes=[];
  const all=new Set([...Object.keys(definedMap),...Object.keys(originalMap)]);
  for(const k of all){
    const orig=originalMap[k],curr=definedMap[k];
    if(!curr&&orig)removes.push(k);
    else if(curr&&JSON.stringify(curr)!==JSON.stringify(orig))adds.push([k,curr]);
  }
  return{adds,removes};
}
function updateExport(){
  const{adds,removes}=buildDiff();
  const box=document.getElementById('export-box');
  if(!adds.length&&!removes.length){box.textContent='';return;}
  const isOW=editorMode==='overworld';
  const lines=['// -- DIFF --'];
  if(removes.length){lines.push('// Removed:');for(const k of removes){const[x,y]=parseKey(k);lines.push(`// DEL t(${x},${y},...)`);}  }
  if(adds.length){lines.push('// Changed:');for(const[k,m]of adds)lines.push(isOW?cellToOWJS(k,m):cellToJS(k,m));}
  box.textContent=lines.join('\n');
}
function getDiff(){return document.getElementById('export-box').textContent;}
function getFull(){
  const isOW=editorMode==='overworld';
  const lines=['// Full export — paste into aerdorn.js'];
  for(const[k,m]of Object.entries(definedMap))lines.push(isOW?cellToOWJS(k,m):cellToJS(k,m));
  return lines.join('\n');
}

function doDownload(text,suf){const b=new Blob([text],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(editorMode==='settlement'?settlementId:editorMode)+'_'+suf+'.js';a.click();}
function doCopy(t){navigator.clipboard.writeText(t).then(()=>statusMsg('Copied!'));}
function statusMsg(msg){const el=document.getElementById('status-msg');el.textContent=msg;setTimeout(()=>{if(el.textContent===msg)el.textContent='';},3000);}

// Save to Game: copies diff JS to clipboard AND saves to localStorage
// so you can paste into aerdorn.js manually or via a future local server
function saveToGame(){
  const{adds,removes}=buildDiff();
  if(!adds.length&&!removes.length){statusMsg('No changes to save.');return;}
  const text=getDiff();
  try{localStorage.setItem('map_patch_'+editorMode+'_'+(settlementId||interiorId||'ow'),text);}catch(e){}
  doCopy(text);
  statusMsg('Diff copied to clipboard. Paste into aerdorn.js.');
}

document.getElementById('btn-save').addEventListener('click',saveToGame);
document.getElementById('btn-copy-diff').addEventListener('click',()=>doCopy(getDiff()));
document.getElementById('btn-export-full').addEventListener('click',()=>doDownload(getFull(),'full'));
document.getElementById('btn-dl-diff').addEventListener('click',()=>doDownload(getDiff(),'diff'));
document.getElementById('btn-cp-diff').addEventListener('click',()=>doCopy(getDiff()));

// ── Palettes ───────────────────────────────────────────────────
function buildTerrainPalette(){
  const types=editorMode==='overworld'?OW_TERRAIN:editorMode==='interior'?INT_TERRAIN:SETTLE_TERRAIN;
  if(!types.find(t=>t.id===currentTerrainId))currentTerrainId=types[0].id;
  document.getElementById('terrain-label').textContent=
    editorMode==='overworld'?'TERRAIN (OW)':editorMode==='interior'?'TERRAIN (INT)':'TERRAIN';
  const tp=document.getElementById('terrain-palette'); tp.innerHTML='';
  for(const t of types){
    const div=document.createElement('div');
    div.className='pitem'+(t.id===currentTerrainId?' sel':'');
    const sw=document.createElement('div');sw.className='swatch';
    const tc=getTileCanvas(t.id,99,99);
    if(tc){const c=document.createElement('canvas');c.width=16;c.height=16;c.getContext('2d').drawImage(tc,0,0,16,16);sw.appendChild(c);}
    else sw.style.background='#3a2a10';
    const span=document.createElement('span');span.textContent=t.l;
    div.appendChild(sw);div.appendChild(span);
    div.addEventListener('click',()=>{
      currentTerrainId=t.id;
      paintTerrain=true; // terrain palette click enables terrain painting
      tp.querySelectorAll('.pitem').forEach(e=>e.classList.remove('sel'));
      div.classList.add('sel');
    });
    tp.appendChild(div);
  }
}

function buildObjPalette(){
  const tabs=document.getElementById('obj-cat-tabs'); tabs.innerHTML='';
  for(const cat of OBJ_CATS){
    const btn=document.createElement('button');
    btn.textContent=cat.label;btn.style.cssText='font-size:10px;padding:2px 4px;';
    btn.classList.toggle('active',cat.id===currentObjCat);
    btn.addEventListener('click',()=>{currentObjCat=cat.id;buildObjPalette();});
    tabs.appendChild(btn);
  }
  const op=document.getElementById('obj-palette'); op.innerHTML='';
  const mk=(label,value)=>{
    const div=document.createElement('div');
    div.className='pitem'+(currentObjId===value?' sel':'');
    const sw=document.createElement('div');sw.className='swatch';
    sw.style.background=value===null?'#1a1208':'#2a1a08';
    if(value===null)sw.style.borderStyle='dashed';
    const span=document.createElement('span');span.textContent=label;
    div.appendChild(sw);div.appendChild(span);
    div.addEventListener('click',()=>{
      currentObjId=value;
      paintTerrain=false; // object palette click — DON'T change terrain when painting
      op.querySelectorAll('.pitem').forEach(e=>e.classList.remove('sel'));
      div.classList.add('sel');
    });
    op.appendChild(div);
  };
  mk('(no change)',null);
  mk('(clear)','');
  const cat=OBJ_CATS.find(c=>c.id===currentObjCat)||OBJ_CATS[0];
  for(const item of cat.items){
    const div=document.createElement('div');
    div.className='pitem'+(currentObjId===item.id?' sel':'');
    const sw=document.createElement('div');sw.className='swatch';sw.style.background='#1a1208';
    try{
      const grid=item.fn(12345);
      if(grid){const c=document.createElement('canvas');c.width=16;c.height=16;const pc=document.createElement('canvas');MF.renderGridToCanvas(grid,pc,1);c.getContext('2d').drawImage(pc,0,0,16,16);sw.innerHTML='';sw.appendChild(c);}
    }catch(e){}
    const span=document.createElement('span');span.textContent=item.l;
    div.appendChild(sw);div.appendChild(span);
    div.addEventListener('click',()=>{
      currentObjId=item.id;
      paintTerrain=false; // object only — don't stomp terrain
      op.querySelectorAll('.pitem').forEach(e=>e.classList.remove('sel'));
      div.classList.add('sel');
    });
    op.appendChild(div);
  }
}

// ── Dropdowns ─────────────────────────────────────────────────
function buildSettlementList(){
  const sel=document.getElementById('settlement-select'); sel.innerHTML='';
  if(!window.WORLD_DATA)return;
  for(const[id,s]of Object.entries(window.WORLD_DATA.settlements)){
    const o=document.createElement('option');o.value=id;o.textContent=s.name||id;
    if(id===settlementId)o.selected=true; sel.appendChild(o);
  }
}
function buildInteriorList(){
  const sel=document.getElementById('interior-select'); sel.innerHTML='';
  const ids=new Set(['blank']);
  if(window.WORLD_DATA){
    for(const s of Object.values(window.WORLD_DATA.settlements))
      for(const meta of Object.values(s.map))
        if(meta.enter&&meta.enter.id)ids.add(meta.enter.id);
  }
  for(const id of[...ids].sort()){const o=document.createElement('option');o.value=id;o.textContent=id;sel.appendChild(o);}
  interiorId=sel.value;
}

// ── Mode / selectors ───────────────────────────────────────────
function applyMode(mode){
  editorMode=mode;
  document.getElementById('settlement-select').style.display=(mode==='settlement'||mode==='interior')?'':'none';
  document.getElementById('interior-select').style.display=mode==='interior'?'':'none';
  if(mode==='overworld'){tileSize=4;document.getElementById('zoom-select').value='4';}
  else if(tileSize<16){tileSize=24;document.getElementById('zoom-select').value='24';}
  buildTerrainPalette(); buildObjPalette(); loadLayer();
}

document.getElementById('mode-select').addEventListener('change',e=>applyMode(e.target.value));
document.getElementById('settlement-select').addEventListener('change',e=>{settlementId=e.target.value;if(editorMode==='interior')buildInteriorList();loadLayer();});
document.getElementById('interior-select').addEventListener('change',e=>{interiorId=e.target.value;loadLayer();});
document.getElementById('zoom-select').addEventListener('change',e=>{tileSize=parseInt(e.target.value);tileCache.clear();objCache.clear();renderAll();});

// ── Mouse ──────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{isMouseDown=true;handleMouse(e,true);});
canvas.addEventListener('mousemove',e=>{if(isMouseDown)handleMouse(e,false);});
canvas.addEventListener('mouseup',()=>{isMouseDown=false;});
canvas.addEventListener('mouseleave',()=>{isMouseDown=false;});
function handleMouse(e,isDown){
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
  const px=(e.clientX-rect.left)*sx,py=(e.clientY-rect.top)*sy;
  const{x,y}=canvasToCell(px,py);
  if(!inBounds(x,y))return;
  if(currentTool==='pick'){if(isDown)selectCell(x,y);}
  else if(currentTool==='fill'){if(isDown){floodFill(x,y);selectCell(x,y);}}
  else{applyPaint(x,y);if(isDown)selectCell(x,y);}
}

// ── Tools + keyboard ───────────────────────────────────────────
document.querySelectorAll('[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentTool=btn.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));
  });
});
document.getElementById('btn-undo').addEventListener('click',undo);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();return;}
  const tm={p:'paint',e:'erase',i:'pick',f:'fill'};
  if(tm[e.key]){currentTool=tm[e.key];document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));}
});

// ── Init ───────────────────────────────────────────────────────
function init(){
  if(!window.WORLD_DATA){statusMsg('ERROR: aerdorn.js not loaded');return;}
  if(!window.MapForge){statusMsg('ERROR: mapforge.js not loaded');return;}
  MF = window.MapForge;
  buildSettlementList(); buildInteriorList(); buildTerrainPalette(); buildObjPalette(); loadLayer();
}
init();
</script>
