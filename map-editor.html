<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aerdorn Map Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0804; color: #c4b590; font-family: Georgia, serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#topbar { background: #161008; border-bottom: 1px solid #3a2a10; padding: 5px 10px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
#topbar h1 { font-size: 13px; color: #e8c870; letter-spacing: 2px; white-space: nowrap; }
select, input[type=text], input[type=number] { background: #0f0c06; border: 1px solid #3a2a10; color: #c4b590; padding: 3px 6px; font-size: 11px; border-radius: 3px; font-family: Georgia, serif; }
button { background: #1a1208; border: 1px solid #3a2a10; color: #a08050; padding: 3px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; white-space: nowrap; }
button:hover { background: #2a1e08; border-color: #6a4820; }
button.active { background: #3a2808; border-color: #e8c870; color: #e8c870; }
button.save-btn { background: linear-gradient(180deg,#3a6018,#204010); border-color: #5a8028; color: #90c050; }
.sep { width: 1px; height: 18px; background: #2a1e10; margin: 0 2px; flex-shrink: 0; }
#main { display: flex; flex: 1; overflow: hidden; }
#left-panel { width: 190px; min-width: 190px; background: #0f0c08; border-right: 1px solid #2a1e10; display: flex; flex-direction: column; overflow: hidden; }
.psec { border-bottom: 1px solid #2a1e10; padding: 6px; flex-shrink: 0; }
.plabel { font-size: 10px; letter-spacing: 2px; color: #5a4820; margin-bottom: 4px; }
.pscroll { overflow-y: auto; }
.pgrid { display: flex; flex-direction: column; gap: 1px; padding: 4px; }
.pitem { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 11px; border: 1px solid transparent; user-select: none; }
.pitem:hover { background: #1a1208; }
.pitem.sel { background: #2a1a08; border-color: #e8c870; color: #e8c870; }
.swatch { width: 16px; height: 16px; border-radius: 2px; border: 1px solid #3a2a10; flex-shrink: 0; overflow: hidden; }
.swatch canvas { display: block; width: 16px !important; height: 16px !important; image-rendering: pixelated; }
/* Left panel tabs */
#lp-tabs { display: flex; border-bottom: 1px solid #2a1e10; flex-shrink: 0; }
#lp-tabs button { flex: 1; border-radius: 0; border: none; border-right: 1px solid #2a1e10; font-size: 10px; padding: 5px 2px; }
#lp-tabs button:last-child { border-right: none; }
#lp-tabs button.active { background: #2a1a08; color: #e8c870; }
.lp-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.lp-panel.visible { display: flex; }
/* Building panel */
.bprop { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; font-size: 11px; }
.bprop label { color: #6a5030; min-width: 60px; font-size: 10px; }
.bprop select, .bprop input { flex: 1; }
.roof-grid { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; }
.roof-swatch { width: 28px; height: 28px; border-radius: 3px; cursor: pointer; border: 2px solid #2a1e10; overflow: hidden; image-rendering: pixelated; }
.roof-swatch.sel { border-color: #e8c870; }
.roof-swatch canvas { display: block; width: 28px; height: 28px; image-rendering: pixelated; }
#bldg-preview-wrap { padding: 6px; border-bottom: 1px solid #2a1e10; }
#bldg-preview { image-rendering: pixelated; display: block; }
/* Canvas */
#canvas-wrap { flex: 1; overflow: auto; background: #080602; display: flex; align-items: flex-start; justify-content: flex-start; padding: 8px; }
#grid-canvas { image-rendering: pixelated; cursor: crosshair; display: block; }
/* Right panel */
#right-panel { width: 205px; min-width: 205px; background: #0f0c08; border-left: 1px solid #2a1e10; display: flex; flex-direction: column; overflow-y: auto; }
.cprop { display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; }
.cprop label { font-size: 10px; color: #6a5030; }
.cprop input, .cprop select { width: 100%; }
#cell-coords { font-size: 11px; color: #8a7050; margin-bottom: 5px; min-height: 14px; }
#export-box { background: #0a0806; border: 1px solid #2a1e10; border-radius: 3px; padding: 5px; font-size: 10px; font-family: monospace; color: #90a878; white-space: pre; overflow-x: auto; min-height: 40px; max-height: 160px; overflow-y: auto; }
#export-box:empty::before { content: '// No changes yet'; color: #3a2a10; }
/* Part cell hatch overlay */
.part-hatch { position: absolute; pointer-events: none; }
</style>
</head>
<body>
<div id="topbar">
  <h1>&#9874; MAP EDITOR</h1>
  <div class="sep"></div>
  <select id="mode-select">
    <option value="settlement">Settlement</option>
    <option value="overworld">Overworld</option>
    <option value="interior">Interior</option>
  </select>
  <select id="settlement-select"></select>
  <select id="interior-select" style="display:none"></select>
  <div class="sep"></div>
  <label style="font-size:10px;color:#6a5030">Zoom:</label>
  <select id="zoom-select">
    <option value="2">2x</option><option value="4">4x</option><option value="6">6x</option>
    <option value="8">8x</option><option value="12">12x</option><option value="16">16x</option>
    <option value="24" selected>24x</option><option value="32">32x</option><option value="48">48x</option>
  </select>
  <div class="sep"></div>
  <button id="tool-paint" class="active" data-tool="paint">&#9999; Paint</button>
  <button id="tool-fill" data-tool="fill">&#9632; Fill</button>
  <button id="tool-erase" data-tool="erase">&#10005; Erase</button>
  <button id="tool-pick" data-tool="pick">&#9677; Pick</button>
  <div class="sep"></div>
  <div id="ow-nav" style="display:none;gap:3px;align-items:center;">
    <button id="ow-pan-n" title="North">&#8593;</button>
    <button id="ow-pan-s" title="South">&#8595;</button>
    <button id="ow-pan-w" title="West">&#8592;</button>
    <button id="ow-pan-e" title="East">&#8594;</button>
    <div class="sep"></div>
    <span style="font-size:10px;color:#6a5030;">Jump:</span>
    <input id="ow-cx" type="text" style="width:40px;" value="346">
    <input id="ow-cy" type="text" style="width:40px;" value="556">
    <button id="ow-go">Go</button>
    <div class="sep"></div>
    <button id="btn-set-start" title="Set player start position here">&#9658; Set Start</button>
    <div class="sep"></div>
  </div>
  <button id="btn-undo">&#8617; Undo</button>
  <div class="sep"></div>
  <button id="btn-save" class="save-btn">&#128190; Save to GitHub</button>
  <button id="btn-copy-diff">&#128203; Diff</button>
  <button id="btn-export-full">&#8595; Full JS</button>
  <button id="btn-new-settlement" title="Create new settlement">&#43; Settlement</button>
  <button id="btn-new-interior" title="Create new interior">&#43; Interior</button>
  <input id="github-token" type="password" placeholder="GitHub token" style="width:130px;font-size:10px;" title="GitHub personal access token (stored in localStorage)">
  <span id="status-msg" style="font-size:11px;color:#5a7840;margin-left:4px;"></span>
</div>
<div id="main">
  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div id="lp-tabs">
      <button class="active" data-lp="terrain">Terrain</button>
      <button data-lp="object">Object</button>
      <button data-lp="building">Building</button>
    </div>
    <!-- TERRAIN TAB -->
    <div id="lp-terrain" class="lp-panel visible" style="flex-direction:column;">
      <div class="psec" style="flex-shrink:0;">
        <div class="plabel" id="terrain-label">TERRAIN</div>
      </div>
      <div class="pscroll" style="flex:1;"><div class="pgrid" id="terrain-palette"></div></div>
      <div id="terrain-style-wrap" style="border-top:1px solid #2a1e10;padding:5px;flex-shrink:0;display:none;">
        <div class="plabel">WOOD COLOUR</div>
        <div id="terrain-style-picker" style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;"></div>
      </div>
    </div>
    <!-- OBJECT TAB -->
    <div id="lp-object" class="lp-panel" style="flex-direction:column;">
      <div class="psec" style="flex-shrink:0;">
        <div style="display:flex;gap:2px;flex-wrap:wrap;" id="obj-cat-tabs"></div>
      </div>
      <div class="pscroll" style="flex:1;"><div class="pgrid" id="obj-palette"></div></div>
      <div id="obj-variant-wrap" style="border-top:1px solid #2a1e10;padding:5px;flex-shrink:0;display:none;">
        <div class="plabel">VARIANT</div>
        <div id="obj-variant-picker" style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;"></div>
      </div>
    </div>
    <!-- BUILDING TAB -->
    <div id="lp-building" class="lp-panel" style="flex-direction:column;overflow-y:auto;">
      <div class="psec">
        <div class="plabel">PREVIEW</div>
        <canvas id="bldg-preview" width="160" height="100" style="width:160px;height:100px;margin-top:4px;image-rendering:pixelated;"></canvas>
      </div>
      <div class="psec">
        <div class="plabel">BUILDING TYPE</div>
        <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;" id="bldg-type-btns"></div>
      </div>
      <div class="psec">
        <div class="plabel">WIDTH / HEIGHT</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;">
          <select id="bldg-w"><option value="20">20px (1)</option><option value="40" selected>40px (2)</option><option value="60">60px (3)</option><option value="80">80px (4)</option></select>
          <span style="color:#5a4820;">x</span>
          <select id="bldg-h"><option value="20">20px (1)</option><option value="40" selected>40px (2)</option><option value="60">60px (3)</option><option value="80">80px (4)</option></select>
        </div>
      </div>
      <div class="psec" id="bldg-footprint-sec">
        <div class="plabel">FOOTPRINT</div>
        <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;" id="bldg-footprint-btns"></div>
      </div>
      <div class="psec" id="bldg-shape-sec">
        <div class="plabel">ROOF SHAPE</div>
        <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;" id="bldg-shape-btns"></div>
      </div>
      <div class="psec" id="bldg-pattern-sec">
        <div class="plabel">TILE PATTERN</div>
        <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;" id="bldg-pattern-btns"></div>
      </div>
      <div class="psec">
        <div class="plabel">ROOF STYLE</div>
        <div class="roof-grid" id="bldg-roof-grid"></div>
      </div>
      <div class="psec">
        <div class="plabel">YARD</div>
        <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;" id="bldg-yard-btns"></div>
      </div>
      <div class="psec">
        <div class="plabel">DETAILS</div>
        <div class="bprop"><label>Interior</label><input id="bldg-interior" type="text" placeholder="inn / shop / house"></div>
        <div class="bprop"><label>Name</label><input id="bldg-name" type="text" placeholder="The Rusty Anchor"></div>
        <button id="btn-place-bldg" style="width:100%;margin-top:6px;background:linear-gradient(180deg,#3a2808,#1a1208);border-color:#6a4820;color:#e8c870;padding:6px;">
          &#127968; Place Building
        </button>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap"><canvas id="grid-canvas"></canvas></div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="psec">
      <div class="plabel">CELL</div>
      <div id="cell-coords">-</div>
      <div class="cprop"><label>Type</label><input id="prop-type" type="text"></div>
      <div class="cprop"><label>Name</label><input id="prop-name" type="text"></div>
      <div class="cprop"><label>interiorType</label><input id="prop-interiorType" type="text"></div>
      <div class="cprop"><label>doors (comma-sep)</label><input id="prop-doors" type="text" placeholder="north,east..."></div>
      <div class="cprop"><label>object</label><input id="prop-object" type="text"></div>
      <div id="row-enter" style="display:none;border-top:1px solid #2a1e10;margin-top:4px;padding-top:4px;">
        <div class="plabel" style="margin-bottom:4px;">ENTER / LINK</div>
        <div class="cprop"><label>Destination</label>
          <select id="prop-enter-id" style="width:100%;font-size:10px;">
            <option value="">(none)</option>
          </select>
        </div>
        <div class="cprop" style="display:flex;gap:4px;">
          <label>Entry X</label><input id="prop-enter-x" type="number" value="1" style="width:45px;">
          <label style="margin-left:4px;">Y</label><input id="prop-enter-y" type="number" value="1" style="width:45px;">
        </div>
        <div class="cprop"><label>Exit to OW</label>
          <select id="prop-exit-layer" style="width:100%;font-size:10px;">
            <option value="">(none)</option>
            <option value="overworld">Overworld</option>
          </select>
        </div>
        <div id="row-exit-ow" style="display:none;">
          <div class="cprop" style="display:flex;gap:4px;">
            <label>OW X</label><input id="prop-exit-x" type="number" value="0" style="width:45px;">
            <label style="margin-left:4px;">Y</label><input id="prop-exit-y" type="number" value="0" style="width:45px;">
          </div>
        </div>
      </div>
      <div class="cprop" id="row-rotation" style="display:none;">
        <label>rotation</label>
        <div style="display:flex;gap:3px;">
          <button class="rot-btn active" data-rot="0">0°</button>
          <button class="rot-btn" data-rot="90">90°</button>
          <button class="rot-btn" data-rot="180">180°</button>
          <button class="rot-btn" data-rot="270">270°</button>
        </div>
      </div>
      <button id="btn-apply" style="width:100%;margin-top:3px;">&#10004; Apply</button>
    </div>
    <div class="psec" style="flex:1;padding-bottom:10px;">
      <div class="plabel">EXPORT DIFF</div>
      <div id="export-box"></div>
      <div style="display:flex;gap:4px;margin-top:5px;">
        <button id="btn-dl-diff" style="flex:1">&#8595; DL</button>
        <button id="btn-cp-diff" style="flex:1">&#128203; Copy</button>
      </div>
    </div>
  </div>
</div>

<!-- New Settlement / Interior modal -->
<div id="new-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1a1408;border:2px solid #6a5030;padding:20px;min-width:340px;font-family:inherit;color:#c8a84a;">
    <h3 id="new-modal-title" style="margin:0 0 14px;font-size:13px;letter-spacing:1px;color:#e8c870;"></h3>
    <div style="display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:center;font-size:11px;">
      <label>Name</label>
      <input id="nm-name" type="text" placeholder="East-Port" style="width:100%;">
      <label>ID (no spaces)</label>
      <input id="nm-id" type="text" placeholder="east_port" style="width:100%;">
      <div id="nm-settle-fields" style="display:contents;">
        <label>Overworld X</label>
        <input id="nm-wx" type="number" value="346" style="width:100%;">
        <label>Overworld Y</label>
        <input id="nm-wy" type="number" value="556" style="width:100%;">
        <label>Has Walls</label>
        <select id="nm-walls" style="width:100%;"><option value="false">No</option><option value="true">Yes</option></select>
      </div>
      <div id="nm-interior-fields" style="display:contents;">
        <label>Settlement</label>
        <select id="nm-settle-sel" style="width:100%;"></select>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">
      <button id="nm-cancel">Cancel</button>
      <button id="nm-create" class="save-btn">Create</button>
    </div>
    <div id="nm-status" style="margin-top:8px;font-size:10px;color:#5a7840;min-height:14px;"></div>
  </div>
</div>

<script src="mapforge.js"></script>

<script src="worlds/settlements/east_port/map.js"></script>
<script src="worlds/settlements/aethel_keep/map.js"></script>

<script src="worlds/settlements/carrowtown_port/map.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// TERRAIN MAPS
// ═══════════════════════════════════════════════════════════════
const TERRAIN_TO_MF = {
  street:'dirt', road:'cobble', building:'farmland', grass:'grass', courtyard:'grass',
  market:'sand', docks:'cobble', gate:'cobble', wall:'rocky', door:'dirt',
  interior:'cave', floor:'dirt', yard:'grass', mud:'mud',
  water:'water', shallow_water:'shallow_water',
  floor_h:'floor_h', floor_v:'floor_v', floor_hbone:'floor_herringbone',
  floor_diag:'floor_diagonal', floor_parq:'floor_parquet', floor_stone:'floor_stone',
  plains:'grass', forest:'forest_floor', wilds:'forest_floor', ocean:'water',
  river:'shallow_water', shore:'sand', farmland:'farmland', mountain:'rocky',

  lava:'lava', ice:'ice', corrupt:'corrupt', cracked:'cracked',
  city:'cobble', town:'grass', village:'grass', ruins:'rocky', castle:'rocky', keep:'rocky',
};
const SETTLE_TERRAIN = [
  {id:'grass',l:'Courtyard (grass)',mf:'grass'},{id:'street',l:'Street (dirt)',mf:'dirt'},
  {id:'road',l:'Road (cobble)',mf:'cobble'},{id:'market',l:'Market (sand)',mf:'sand'},
  {id:'mud',l:'Mud',mf:'mud'},{id:'docks',l:'Docks (cobble)',mf:'cobble'},
  {id:'building',l:'Building',mf:'farmland'},{id:'wall',l:'Wall (stone)',mf:'rocky'},
  {id:'gate',l:'Gate',mf:'cobble'},{id:'door',l:'Door',mf:'dirt'},
  {id:'interior',l:'Interior (cave)',mf:'cave'},{id:'floor',l:'Floor (dirt)',mf:'dirt'},
  {id:'floor_h',l:'Planks H',mf:'floor_h',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},{id:'floor_v',l:'Planks V',mf:'floor_v',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},
  {id:'floor_hbone',l:'Herringbone',mf:'floor_herringbone',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},{id:'floor_diag',l:'Diagonal',mf:'floor_diagonal',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},

  {id:'interior',l:'Cave Floor',mf:'cave'},{id:'floor',l:'Dirt Floor',mf:'dirt'},
  {id:'floor_h',l:'Planks H',mf:'floor_h',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},{id:'floor_v',l:'Planks V',mf:'floor_v',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},
  {id:'floor_hbone',l:'Herringbone',mf:'floor_herringbone',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},{id:'floor_diag',l:'Diagonal',mf:'floor_diagonal',styles:['Pine','Dark Oak','Ash','Walnut','Maple','Birch']},

  {id:'wall',l:'Wall (stone)',mf:'rocky'},{id:'door',l:'Door',mf:'dirt'},
  {id:'grass',l:'Yard (grass)',mf:'grass'},{id:'mud',l:'Mud',mf:'mud'},

// ═══════════════════════════════════════════════════════════════
// OBJECT DEFINITIONS — single source of truth
// w,h in pixels (native MapForge resolution, 20px = 1 cell)
// snap: where to anchor within the cell
//   'center' = centred in cell

function parseKey(k) {
  const ci = k.lastIndexOf(',');
  return [parseInt(k.slice(0,ci),10), parseInt(k.slice(ci+1),10)];
}

function variantSeed(type, v) {
  let h = v * 7919;
  for(let i=0;i<type.length;i++) h = (h*31 + type.charCodeAt(i)) & 0x7fffffff;
  return h || 1;
}

// Cells spanned by an anchor object given rotation
// rotation 0/180: w cols east, h rows north (y increases north in our convention)
// rotation 90/270: swap w/h
function getSpanCells(ax, ay, objW, objH, rotation, defCells) {
  const cells = [];
  // Use explicit cell override if provided (e.g. beds force 1x1)
  let cw = defCells ? defCells[0] : Math.ceil(objW / 20);
  let ch = defCells ? defCells[1] : Math.ceil(objH / 20);
  if (rotation === 90 || rotation === 270) { const tmp=cw; cw=ch; ch=tmp; }
  // Anchor is bottom-left of the sprite footprint (south=low y, north=high y)
  // Cells extend east (+x) and north (+y) from anchor
  for (let dx=0; dx<cw; dx++) {
    for (let dy=0; dy<ch; dy++) {
      if (dx===0 && dy===0) continue; // skip anchor
      cells.push({x: ax+dx, y: ay+dy});
    }
  }
  return cells;
}

function getObjDef(id) { return OBJECT_DEFS[id] || null; }

function inferBg(x, y) {
  if (editorMode === 'overworld') {
    const m = window.WORLD_DATA.meta && window.WORLD_DATA.meta[`${x},${y}`];
    if (m) return m;
    return window.WORLD_DATA.inferTerrain ? window.WORLD_DATA.inferTerrain(x,y) : {type:'plains',name:''};
  }
  if (editorMode === 'settlement') return {type:'grass', name:''};
  return {type:'interior', name:''};
}

function buildDisplayMap(x0,x1,y0,y1) {
  const dm = {};
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) {
    const k=`${x},${y}`;
    dm[k] = definedMap[k] ? Object.assign({},definedMap[k]) : inferBg(x,y);
  }
  return dm;
}

function loadLayer() {
  undoStack=[]; selectedCell=null; tileCache.clear(); objCache.clear();
  definedMap={}; originalMap={};
  if (editorMode === 'settlement') {
    const s = window.WORLD_DATA && window.WORLD_DATA.settlements[settlementId];
    if (!s) { statusMsg('Unknown settlement'); return; }
    for (const [k,v] of Object.entries(s.map)) { definedMap[k]=Object.assign({},v); originalMap[k]=Object.assign({},v); }
    console.log('[Editor] Settlement', settlementId, 'keys:', Object.keys(definedMap).length);
  } else if (editorMode === 'overworld') {
    for (const [k,v] of Object.entries(window.WORLD_DATA.meta||{})) { definedMap[k]=Object.assign({},v); originalMap[k]=Object.assign({},v); }
    console.log('[Editor] OW keys:', Object.keys(definedMap).length);
  } else {
    const stored = INTERIOR_STORE[interiorId];
    if (stored) {
      for (const [k,v] of Object.entries(stored)) { definedMap[k]=Object.assign({},v); originalMap[k]=Object.assign({},v); }
    } else {
      for (let x=0;x<=13;x++) for (let y=0;y<=11;y++) {
        const v=(x===0||x===13||y===0||y===11)?{type:'wall',name:'Wall'}:{type:'interior',name:'Floor'};
        definedMap[`${x},${y}`]=Object.assign({},v); originalMap[`${x},${y}`]=Object.assign({},v);
      }
      definedMap['6,0']={type:'door',name:'Entrance'}; originalMap['6,0']={type:'door',name:'Entrance'};
    }
  }
  computeBounds();
  map = buildDisplayMap(bounds.minX, bounds.maxX, bounds.minY, bounds.maxY);
  renderAll(); clearInspector(); updateExport();
}

// ═══════════════════════════════════════════════════════════════
// BOUNDS
// ═══════════════════════════════════════════════════════════════
let bounds = {minX:0,maxX:0,minY:0,maxY:0};
function computeBounds() {
  if (editorMode==='overworld') {
    const vr=OW_VIEWPORT_R;
    bounds={minX:owCX-vr,maxX:owCX+vr,minY:owCY-vr,maxY:owCY+vr};
    return;
  }
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (const k of Object.keys(definedMap)) {
    const [x,y]=parseKey(k); if(isNaN(x))continue;
    if(x<mnX)mnX=x;if(x>mxX)mxX=x;if(y<mnY)mnY=y;if(y>mxY)mxY=y;
  }
  if(!isFinite(mnX)){bounds={minX:0,maxX:10,minY:0,maxY:10};return;}
  bounds={minX:mnX-2,maxX:mxX+2,minY:mnY-2,maxY:mxY+2};
  console.log('[Editor] Bounds',bounds,'grid',gridW(),'x',gridH());
}
function gridW(){return bounds.maxX-bounds.minX+1;}
function gridH(){return bounds.maxY-bounds.minY+1;}
function cellToCanvas(x,y){
  const px=(x-bounds.minX)*tileSize;
  // Overworld: y increases downward (no flip). Settlement/interior: y=0=south=bottom (flip)
  const py=editorMode==='overworld'
    ? (y-bounds.minY)*tileSize
    : (gridH()-1-(y-bounds.minY))*tileSize;
  return{px,py};
}
function canvasToCell(px,py){
  const x=Math.floor(px/tileSize)+bounds.minX;
  const y=editorMode==='overworld'
    ? Math.floor(py/tileSize)+bounds.minY
    : (gridH()-1-Math.floor(py/tileSize))+bounds.minY;
  return{x,y};
}
function inBounds(x,y){return x>=bounds.minX&&x<=bounds.maxX&&y>=bounds.minY&&y<=bounds.maxY;}

// ═══════════════════════════════════════════════════════════════
// TILE / SPRITE RENDERING
// ═══════════════════════════════════════════════════════════════
function getTileCanvas(type, x, y, variant, terrainStyle) {
  const seed = (variant != null) ? variantSeed(type, variant) : (((x&0xffff)<<16)|(y&0xffff))>>>0;
  const floorMap = {floor_h:'h',floor_v:'v',floor_hbone:'herringbone',floor_diag:'diagonal',floor_parq:'parquet',floor_stone:'stone'};
  if (floorMap[type]) {
    const st = terrainStyle!=null ? terrainStyle : null;
    const key='fl_'+floorMap[type]+'_'+seed+'_s'+(st??'x'); if(tileCache.has(key))return tileCache.get(key);
    try{const g=MF.makeFloorboard(floorMap[type],seed,st);const c=document.createElement('canvas');MF.renderGridToCanvas(g,c,1);tileCache.set(key,c);return c;}catch(e){return null;}
  }
  if (type==='cracked') {
    const key='crk_'+seed; if(tileCache.has(key))return tileCache.get(key);
    try{const g=MF.makeCrackedEarth(seed);const c=document.createElement('canvas');MF.renderGridToCanvas(g,c,1);tileCache.set(key,c);return c;}catch(e){return null;}
  }
  const mf=TERRAIN_TO_MF[type]||'grass';
  const key=mf+'_'+seed; if(tileCache.has(key))return tileCache.get(key);
  try{const g=MF.makeTerrain(mf,seed,{});const c=document.createElement('canvas');MF.renderGridToCanvas(g,c,1);tileCache.set(key,c);return c;}catch(e){return null;}
}

function getObjSpriteCanvas(objId, seed, style, linen) {
  const def = OBJECT_DEFS[objId]; if(!def||!def.fn)return null;
  const styleVal = (def.styles && style!=null) ? style : null;
  const linenVal = (def.linen && linen!=null) ? linen : null;
  const key=objId+'_'+seed+'_s'+(styleVal??'x')+'_l'+(linenVal??'x'); if(objCache.has(key))return objCache.get(key);
  let g; try{g=def.fn(seed,styleVal,linenVal);}catch(e){return null;}
  if(!g)return null;
  const c=document.createElement('canvas'); MF.renderGridToCanvas(g,c,1);
  objCache.set(key,c); return c;
}

// Generate building canvas from stored cell metadata (used for editor rendering)
function getBldgCanvasFromMeta(meta, seed) {
  if(!MF||!MF.ROOF_STYLES) return null;
  const cacheKey = `bldgmeta_${JSON.stringify({t:meta.bldgType,pw:meta.bldgPxW,ph:meta.bldgPxH,rs:meta.roofStyle,rsh:meta.roofShape,p:meta.bldgPattern,fp:meta.bldgFootprint,y:meta.bldgYard})}_${seed}`;
  if(objCache.has(cacheKey)) return objCache.get(cacheKey);
  const w=meta.bldgPxW||meta.bldgW*20;
  const h=meta.bldgPxH||meta.bldgH*20;
  const type=meta.bldgType||'standard';
  const footprint=meta.bldgFootprint||'rect';
  const shape=meta.roofShape||'hip';
  const pattern=meta.bldgPattern||'default';
  const styleId=meta.roofStyle||'brown';
  const yard=meta.bldgYard||'none';
  const rs=MF.ROOF_STYLES.find(s=>s.id===styleId)||MF.ROOF_STYLES[0];
  const{RL,RM,RD,RS}=rs;
  const yardStrip=20;
  const rW=(yard==='left'||yard==='right')?w-yardStrip:w;
  const rH=(yard==='top'||yard==='bottom')?h-yardStrip:h;
  const numCh=rW>=60?2:1;
  const chimneys=MF.autoChimneys?MF.autoChimneys(rW,rH,numCh):[];
  const effectiveShape=(shape==='hip'&&rW>rH*1.4)?'ridge':shape;
  let grid=null;
  try{
    if(type==='watchtower')       grid=MF.makeWatchtower(seed);
    else if(type==='windmill')    grid=MF.makeWindmill(seed);
    else if(type==='gate')        grid=MF.makeGate(seed);
    else if(type==='castle_wall') grid=MF.makeCastleWall('straight_h',seed);
    else if(type==='dungeon_ent') grid=MF.makeDungeonEntrance(seed);
    else if(type==='ruins')       grid=rs.isThatch?MF.makeThatchRoof(rW,rH,'hip',chimneys,seed):MF.makeRuins(rW,rH,RL,RM,RD,RS,seed,pattern);
    else if(type==='l_shape'||footprint==='L')  grid=rs.isThatch?MF.makeIrregularThatch('L',rW,rH,chimneys,seed):MF.makeIrregularRoof('L',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(type==='t_shape'||footprint==='T')  grid=rs.isThatch?MF.makeIrregularThatch('T',rW,rH,chimneys,seed):MF.makeIrregularRoof('T',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(type==='irregular'||footprint==='irregular') grid=rs.isThatch?MF.makeIrregularThatch('irregular',rW,rH,chimneys,seed):MF.makeIrregularRoof('irregular',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(rs.isThatch) grid=MF.makeThatchRoof(rW,rH,effectiveShape,chimneys,seed);
    else grid=MF.makeRoofByShape(rW,rH,effectiveShape,pattern,RL,RM,RD,RS,chimneys,seed);
    if(grid&&yard!=='none') grid=MF.composeWithYard(grid,rW,rH,yard,w,h,styleId,seed);
  }catch(e){return null;}
  if(!grid)return null;
  const c=document.createElement('canvas'); MF.renderGridToCanvas(grid,c,1);
  objCache.set(cacheKey,c); return c;
}

// Generate building canvas from cellW/cellH/shape/styleId (used for redrawAnchorGroup and legacy)
function getBldgSprite(cellW, cellH, shape, styleId, chimneys, seed) {
  if(!MF.ROOF_STYLES)return null;
  const pw=cellW*20, ph=cellH*20;
  const key=`bldg_${pw}x${ph}_${shape}_${styleId}_${seed}`;
  if(objCache.has(key))return objCache.get(key);
  const style=MF.ROOF_STYLES.find(s=>s.id===styleId)||MF.ROOF_STYLES[0];
  if(!style)return null;
  let g=null;
  try{
    const ch=MF.autoChimneys?MF.autoChimneys(pw,ph,chimneys):[];
    g=style.isThatch?MF.makeThatchRoof(pw,ph,shape,ch,seed):MF.makeRoofByShape(pw,ph,shape,style,ch,seed);
  }catch(e){return null;}
  if(!g)return null;
  const c=document.createElement('canvas'); MF.renderGridToCanvas(g,c,1);
  objCache.set(key,c); return c;
}

// Draw a sprite onto the main canvas with rotation and snap offset
// The sprite src canvas is nativeW x nativeH pixels
// It's rendered into a tileSize*cellW x tileSize*cellH area starting at (px,py)
function drawSprite(srcCanvas, px, py, nativeW, nativeH, cellW, cellH, snap, rotation) {
  if(!srcCanvas)return;
  const dstW = cellW * tileSize;
  const dstH = cellH * tileSize;

  // Native scaled size
  let sprW = (nativeW / 20) * tileSize;
  let sprH = (nativeH / 20) * tileSize;

  // For single-cell objects, scale down to fit within the cell
  // Allow up to 15% overflow for a slight overlap effect (e.g. beds)
  if(cellW===1 && cellH===1){
    const maxW = tileSize * 1.15;
    const maxH = tileSize * 1.15;
    if(sprW > maxW || sprH > maxH){
      const scale = Math.min(maxW/sprW, maxH/sprH);
      sprW *= scale; sprH *= scale;
    }
  }

  // After rotation, effective sprite dimensions
  const rotW = (rotation===90||rotation===270) ? sprH : sprW;
  const rotH = (rotation===90||rotation===270) ? sprW : sprH;

  // Snap offset within the destination area
  let offX, offY;
  if (snap==='south') {
    offX = (dstW - rotW) / 2;
    offY = dstH - rotH;
  } else if (snap==='north') {
    offX = (dstW - rotW) / 2;
    offY = 0;
  } else { // center
    offX = (dstW - rotW) / 2;
    offY = (dstH - rotH) / 2;
  }

  ctx.save();
  // Clip to the destination cell(s) area so sprites don't leak outside
  ctx.beginPath();
  ctx.rect(px, py, dstW, dstH);
  ctx.clip();
  ctx.translate(px + offX + rotW/2, py + offY + rotH/2);
  if(rotation) ctx.rotate(rotation * Math.PI / 180);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(srcCanvas, -sprW/2, -sprH/2, sprW, sprH);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// CANVAS RENDERING
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

function renderAll() {
  canvas.width = gridW()*tileSize; canvas.height = gridH()*tileSize;
  ctx.fillStyle = '#050402'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Pass 1: terrain — iterate viewport grid, use inferBg for undefined cells
  for (let gx=bounds.minX; gx<=bounds.maxX; gx++) {
    for (let gy=bounds.minY; gy<=bounds.maxY; gy++) {
      const k=`${gx},${gy}`;
      const meta = definedMap[k] || inferBg(gx,gy);
      const {px,py}=cellToCanvas(gx,gy);
      const tc=getTileCanvas(meta.type,gx,gy,meta.variant,meta.terrainStyle);
      if(tc) ctx.drawImage(tc,px,py,tileSize,tileSize);
      else { ctx.fillStyle='#1a1408'; ctx.fillRect(px,py,tileSize,tileSize); }
      if(editorMode==='overworld'&&(meta.type==='town'||meta.type==='city'||meta.type==='village'||meta.type==='castle')){
        ctx.fillStyle='#e8c870cc';const sz=Math.max(2,tileSize/4);ctx.fillRect(px+tileSize/2-sz/2,py+tileSize/2-sz/2,sz,sz);
      }
    }
  }

  // Pass 2: objects — only draw on anchor cells (skip _part cells)
  for (const [k,meta] of Object.entries(definedMap)) {
    if (meta.object==='_part') continue; // span cell — skip
    const [x,y]=parseKey(k); if(isNaN(x))continue;
    const {px,py}=cellToCanvas(x,y);
    const seed=(((x&0xffff)<<16)|(y&0xffff))>>>0;

    if (meta.object && meta.object !== '_part') {
      const def=getObjDef(meta.object);
      if(def){
        const cw=def.cells?def.cells[0]:Math.ceil(def.w/20);
        const ch=def.cells?def.cells[1]:Math.ceil(def.h/20);
        const rot=meta.rotation||0;
        const objSeed = meta.objVariant!=null ? variantSeed(meta.object,meta.objVariant) : seed;
        const sc=getObjSpriteCanvas(meta.object,objSeed,meta.objStyle,meta.objLinen);
        drawSprite(sc,px,py,def.w,def.h,cw,ch,def.snap,rot);
      }
    } else if (meta.type==='building' && meta.bldgW) {
      // Editor-placed building — use full config to generate roof
      const sc = getBldgCanvasFromMeta(meta, seed);
      if(sc) ctx.drawImage(sc, px, py, meta.bldgW*tileSize, meta.bldgH*tileSize);
    } else if (meta.type==='building') {
      // Legacy single-cell building
      const styleId = ({inn:'brown',shop:'terra',house:'dkbrown',chapel:'slate',blacksmith:'darkslate',default:'brown'})[meta.interiorType]||'brown';
      const sc=getBldgSprite(1,1,'hip',styleId,1,seed);
      if(sc) ctx.drawImage(sc,px,py,tileSize,tileSize);
    }
  }

  // Pass 3: _part cell hatch overlays
  for (const [k,meta] of Object.entries(definedMap)) {
    if (meta.object !== '_part') continue;
    const [x,y]=parseKey(k); if(isNaN(x))continue;
    const {px,py}=cellToCanvas(x,y);
    if(tileSize>=8){
      ctx.save();
      ctx.globalAlpha=0.3;
      ctx.strokeStyle='#e8c870';ctx.lineWidth=1;
      for(let d=-tileSize;d<tileSize*2;d+=6){ctx.beginPath();ctx.moveTo(px+d,py);ctx.lineTo(px+d+tileSize,py+tileSize);ctx.stroke();}
      ctx.globalAlpha=1;
      ctx.restore();
    }
  }

  if(selectedCell) _drawSel(selectedCell.x,selectedCell.y);
}

function _drawCellTerrain(x,y,meta) {
  const {px,py}=cellToCanvas(x,y);
  const tc=getTileCanvas(meta.type,x,y,meta.variant,meta.terrainStyle);
  if(tc) ctx.drawImage(tc,px,py,tileSize,tileSize);
  else { ctx.fillStyle='#1a1408'; ctx.fillRect(px,py,tileSize,tileSize); }
}

function _drawSel(x,y){
  const{px,py}=cellToCanvas(x,y);
  ctx.strokeStyle='#e8c870';ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,tileSize-2,tileSize-2);
}

function redrawCell(x,y){
  const meta=definedMap[`${x},${y}`]||(editorMode==='overworld'?inferBg(x,y):map[`${x},${y}`]);
  if(meta&&meta.object==='_part'&&meta.anchor){
    const [ax,ay]=parseKey(meta.anchor); redrawAnchorGroup(ax,ay); return;
  }
  if(meta&&meta.bldgW){redrawAnchorGroup(x,y);return;}
  // Single cell
  const{px,py}=cellToCanvas(x,y);
  ctx.fillStyle='#050402';ctx.fillRect(px,py,tileSize,tileSize);
  if(meta)_drawCellTerrain(x,y,meta);
  // Redraw object pass for this cell only
  if(meta&&meta.object&&meta.object!=='_part'){
    const posSeed=(((x&0xffff)<<16)|(y&0xffff))>>>0;
    const def=getObjDef(meta.object);
    if(def){
      const objSeed=meta.objVariant!=null?variantSeed(meta.object,meta.objVariant):posSeed;
      const sc=getObjSpriteCanvas(meta.object,objSeed,meta.objStyle,meta.objLinen);
      const cw=def.cells?def.cells[0]:Math.ceil(def.w/20);
      const ch=def.cells?def.cells[1]:Math.ceil(def.h/20);
      drawSprite(sc,px,py,def.w,def.h,cw,ch,def.snap,meta.rotation||0);
    }
  } else if(meta&&meta.type==='building'){
    const seed=(((x&0xffff)<<16)|(y&0xffff))>>>0;
    const sc=getBldgSprite(1,1,meta.roofShape||'hip',meta.roofStyle||'brown',1,seed);
    if(sc)ctx.drawImage(sc,px,py,tileSize,tileSize);
  }
  if(selectedCell&&selectedCell.x===x&&selectedCell.y===y)_drawSel(x,y);
}

function redrawAnchorGroup(ax,ay){
  const meta=definedMap[`${ax},${ay}`]; if(!meta)return;
  const cellW=meta.bldgW||1, cellH=meta.bldgH||1;
  for(let dx=0;dx<cellW;dx++) for(let dy=0;dy<cellH;dy++){
    const{px,py}=cellToCanvas(ax+dx,ay+dy);
    ctx.fillStyle='#050402';ctx.fillRect(px,py,tileSize,tileSize);
    const cm=definedMap[`${ax+dx},${ay+dy}`]||inferBg(ax+dx,ay+dy);
    if(cm)_drawCellTerrain(ax+dx,ay+dy,cm);
  }
  const{px,py}=cellToCanvas(ax,ay);
  const seed=(((ax&0xffff)<<16)|(ay&0xffff))>>>0;
  const sc = meta.bldgType ? getBldgCanvasFromMeta(meta,seed) : getBldgSprite(cellW,cellH,meta.roofShape||'hip',meta.roofStyle||'brown',1,seed);
  if(sc) ctx.drawImage(sc,px,py,cellW*tileSize,cellH*tileSize);
  if(selectedCell&&selectedCell.x===ax&&selectedCell.y===ay)_drawSel(ax,ay);
}

// ═══════════════════════════════════════════════════════════════
// EDIT OPERATIONS
// ═══════════════════════════════════════════════════════════════
function pushUndo(x,y){
  const k=`${x},${y}`;
  undoStack.push({k,dispPrev:map[k]?Object.assign({},map[k]):null,defPrev:definedMap[k]?Object.assign({},definedMap[k]):null});
  if(undoStack.length>400)undoStack.shift();
}

function applyPaint(x,y){
  if(!inBounds(x,y))return;
  // Clicking a _part cell — redirect to anchor
  const existing_meta=map[`${x},${y}`];
  if(existing_meta&&existing_meta.object==='_part'&&existing_meta.anchor){
    if(currentTool==='erase'){eraseAnchorGroup(...parseKey(existing_meta.anchor));return;}
    if(currentTool==='pick'){selectCell(...parseKey(existing_meta.anchor));return;}
    return; // don't paint over span cells
  }
  const k=`${x},${y}`;
  if(currentTool==='erase'){
    if(!definedMap[k])return; // only erase explicitly defined cells
    // If it has span cells, erase those too
    const dm=definedMap[k];
    if(dm&&dm.bldgW)eraseAnchorGroup(x,y);
    else{pushUndo(x,y);delete definedMap[k];map[k]=inferBg(x,y);redrawCell(x,y);}
  } else {
    const ex=definedMap[k]?Object.assign({},definedMap[k]):Object.assign({},inferBg(x,y));
    if(paintTerrain){ex.type=currentTerrainId;delete ex.variant;if(currentTerrainStyle!=null){ex.terrainStyle=currentTerrainStyle;}else delete ex.terrainStyle;}
    if(currentObjId==='')delete ex.object;
    else if(currentObjId!==null){ex.object=currentObjId;ex.objVariant=currentObjVariant;if(currentObjStyle!=null)ex.objStyle=currentObjStyle;else delete ex.objStyle;if(currentObjLinen!=null)ex.objLinen=currentObjLinen;else delete ex.objLinen;}
    pushUndo(x,y);definedMap[k]=ex;map[k]=ex;
    redrawCell(x,y);
  }
  updateExport();
}

function eraseAnchorGroup(ax,ay){
  const meta=definedMap[`${ax},${ay}`];if(!meta)return;
  const cw=meta.bldgW||1,ch=meta.bldgH||1;
  for(let dx=0;dx<cw;dx++) for(let dy=0;dy<ch;dy++){
    const x=ax+dx,y=ay+dy,k=`${x},${y}`;
    pushUndo(x,y);delete definedMap[k];map[k]=inferBg(x,y);
  }
  redrawAnchorGroup(ax,ay);
  updateExport();
}

function placeBuilding(ax,ay){
  const{type,w,h,footprint,shape,pattern,styleId,yard,interiorType,name}=bldgConfig;
  // Cell dimensions: w/h are pixel dimensions (20px=1 cell)
  const cellW=Math.ceil(w/20), cellH=Math.ceil(h/20);
  // Check all target cells in bounds
  for(let dx=0;dx<cellW;dx++) for(let dy=0;dy<cellH;dy++) if(!inBounds(ax+dx,ay+dy))return;
  // Erase existing buildings at these cells
  for(let dx=0;dx<cellW;dx++) for(let dy=0;dy<cellH;dy++){
    const k=`${ax+dx},${ay+dy}`;const ex=definedMap[k];
    if(ex&&ex.object==='_part'&&ex.anchor)eraseAnchorGroup(...parseKey(ex.anchor));
    else if(ex&&ex.bldgW)eraseAnchorGroup(ax+dx,ay+dy);
  }
  // Write anchor with full config so engine can regenerate the roof
  const seed=(((ax&0xffff)<<16)|(ay&0xffff))>>>0;
  const anchorMeta={
    type:'building', name:name||'', interiorType:interiorType||'house',
    bldgType:type, bldgW:cellW, bldgH:cellH,
    bldgPxW:w, bldgPxH:h,
    roofStyle:styleId, roofShape:shape, bldgPattern:pattern,
    bldgFootprint:footprint, bldgYard:yard,
  };
  pushUndo(ax,ay); definedMap[`${ax},${ay}`]=anchorMeta; map[`${ax},${ay}`]=Object.assign({},anchorMeta);
  // Write span cells
  for(let dx=0;dx<cellW;dx++) for(let dy=0;dy<cellH;dy++){
    if(dx===0&&dy===0)continue;
    const k=`${ax+dx},${ay+dy}`;
    const partMeta={type:'grass',object:'_part',anchor:`${ax},${ay}`};
    pushUndo(ax+dx,ay+dy); definedMap[k]=partMeta; map[k]=Object.assign({},partMeta);
  }
  redrawAnchorGroup(ax,ay);
  updateExport();
  statusMsg(`Placed ${cellW}x${cellH} building`);
}

function floodFill(startX,startY){
  if(!inBounds(startX,startY))return;
  const targetType=(map[`${startX},${startY}`]||{}).type||null;
  const visited=new Set();const queue=[[startX,startY]];visited.add(`${startX},${startY}`);
  while(queue.length){
    const[cx,cy]=queue.shift();
    const ex=definedMap[`${cx},${cy}`]?Object.assign({},definedMap[`${cx},${cy}`]):Object.assign({},inferBg(cx,cy));
    if(paintTerrain){ex.type=currentTerrainId;delete ex.variant;if(currentTerrainStyle!=null){ex.terrainStyle=currentTerrainStyle;}else delete ex.terrainStyle;}
    if(currentObjId==='')delete ex.object;
    else if(currentObjId!==null)ex.object=currentObjId;
    pushUndo(cx,cy);definedMap[`${cx},${cy}`]=ex;map[`${cx},${cy}`]=ex;
    redrawCell(cx,cy);
    for(const[nx,ny]of[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]]){
      const nk=`${nx},${ny}`;
      if(visited.has(nk)||!inBounds(nx,ny))continue;
      if((map[nk]||{}).type===targetType){visited.add(nk);queue.push([nx,ny]);}
    }
  }
  updateExport();
}

function undo(){
  if(!undoStack.length)return;
  const{k,dispPrev,defPrev}=undoStack.pop();
  const[x,y]=parseKey(k);
  if(defPrev)definedMap[k]=defPrev;else delete definedMap[k];
  map[k]=dispPrev||inferBg(x,y);
  redrawCell(x,y);
  if(selectedCell&&selectedCell.x===x&&selectedCell.y===y)populateInspector(x,y);
  updateExport();statusMsg('Undone.');
}

function populateEnterDropdown() {
  const sel = document.getElementById('prop-enter-id');
  const cur = sel.value;
  sel.innerHTML = '<option value="">(none)</option>';
  const settlements = window.WORLD_DATA && window.WORLD_DATA.settlements || {};
  const groups = {settlements:[], interiors:[]};
  for (const [id, s] of Object.entries(settlements)) {
    if (s.isInterior) groups.interiors.push([id, s.name||id]);
    else groups.settlements.push([id, s.name||id]);
  }
  for (const [label, items] of [['Settlements', groups.settlements],['Interiors', groups.interiors]]) {
    if (!items.length) continue;
    const g = document.createElement('optgroup');
    g.label = label;
    for (const [id, name] of items.sort((a,b)=>a[1].localeCompare(b[1]))) {
      const o = document.createElement('option');
      o.value = id; o.textContent = name + ' [' + id + ']';
      if (id === cur) o.selected = true;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
}

function populateInspector(x,y){
  const meta=map[`${x},${y}`]||{};
  const isDef=!!definedMap[`${x},${y}`];
  document.getElementById('cell-coords').textContent=`x=${x}, y=${y} ${isDef?'':'(bg)'}(${meta.type||'?'})`;
  document.getElementById('prop-type').value=meta.type||'';
  document.getElementById('prop-name').value=meta.name||'';
  document.getElementById('prop-interiorType').value=meta.interiorType||'';
  document.getElementById('prop-doors').value=Array.isArray(meta.doors)?meta.doors.join(','):(meta.doors||'');
  document.getElementById('prop-object').value=meta.object||'';

  // Enter/exit section — always show when a cell is selected
  document.getElementById('row-enter').style.display = '';
  populateEnterDropdown();
  const enter = meta.enter || {};
  document.getElementById('prop-enter-id').value = enter.id || '';
  document.getElementById('prop-enter-x').value = enter.entryPos ? enter.entryPos.x : 1;
  document.getElementById('prop-enter-y').value = enter.entryPos ? enter.entryPos.y : 1;
  const exit = meta.exit || {};
  const exitLayer = exit.layer || '';
  document.getElementById('prop-exit-layer').value = exitLayer;
  document.getElementById('row-exit-ow').style.display = exitLayer === 'overworld' ? '' : 'none';
  document.getElementById('prop-exit-x').value = exit.pos ? exit.pos.x : 0;
  document.getElementById('prop-exit-y').value = exit.pos ? exit.pos.y : 0;

  // Show rotation buttons if cell has a rotatable object
  const hasObj=meta.object&&meta.object!=='_part';
  document.getElementById('row-rotation').style.display=hasObj?'':'none';
  if(hasObj){
    const rot=meta.rotation||0;
    document.querySelectorAll('.rot-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.rot)===rot));

function cellToJS(k, meta) {
  const [x,y] = parseKey(k);
  const ex = {};
  // Terrain style
  if (meta.terrainStyle != null) ex.terrainStyle = meta.terrainStyle;
  // Building properties
  if (meta.interiorType)  ex.interiorType  = meta.interiorType;
  if (meta.doors && meta.doors.length) ex.doors = meta.doors;
  if (meta.enter)         ex.enter         = meta.enter;
  if (meta.exit)          ex.exit          = meta.exit;
  if (meta.object)        ex.object        = meta.object;
  if (meta.object === '_part' && meta.anchor) ex.anchor = meta.anchor;
  if (meta.bldgType)      ex.bldgType      = meta.bldgType;
  if (meta.bldgW)         ex.bldgW         = meta.bldgW;
  if (meta.bldgH)         ex.bldgH         = meta.bldgH;
  if (meta.bldgPxW)       ex.bldgPxW       = meta.bldgPxW;
  if (meta.bldgPxH)       ex.bldgPxH       = meta.bldgPxH;
  if (meta.roofStyle)     ex.roofStyle     = meta.roofStyle;
  if (meta.roofShape)     ex.roofShape     = meta.roofShape;
  if (meta.bldgPattern)   ex.bldgPattern   = meta.bldgPattern;
  if (meta.bldgFootprint && meta.bldgFootprint !== 'rect') ex.bldgFootprint = meta.bldgFootprint;
  if (meta.bldgYard && meta.bldgYard !== 'none') ex.bldgYard = meta.bldgYard;
  if (meta.rotation)      ex.rotation      = meta.rotation;
  if (meta.objVariant != null) ex.objVariant = meta.objVariant;
  if (meta.objStyle != null)   ex.objStyle  = meta.objStyle;
  if (meta.objLinen != null)   ex.objLinen  = meta.objLinen;
  const es = Object.keys(ex).length ? ', ' + JSON.stringify(ex).replace(/"(\w+)":/g,'$1:') : '';
  const n = (meta.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `  t(${x},${y},'${meta.type||''}','${n}'${es});`;
}

function cellToOWJS(k, meta) {
  const [x,y] = parseKey(k);
  const n = (meta.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `defCell(${x},${y},'${meta.type||''}','${n}');`;
}

function buildDiff() {
  const adds = [], removes = [];
  const all = new Set([...Object.keys(definedMap), ...Object.keys(originalMap)]);
  for (const k of all) {
    const orig = originalMap[k], curr = definedMap[k];
    if (!curr && orig) removes.push(k);
    else if (curr && JSON.stringify(curr) !== JSON.stringify(orig)) adds.push([k, curr]);
  }
  return {adds, removes};
}

function updateExport() {
  const {adds, removes} = buildDiff();
  const box = document.getElementById('export-box');
  if (!adds.length && !removes.length) { box.textContent = ''; return; }
  const isOW = editorMode === 'overworld';
  const lines = ['// -- DIFF --'];
  if (removes.length) { lines.push('// Removed:'); for (const k of removes) { const [x,y] = parseKey(k); lines.push(`// DEL t(${x},${y},...)`) } }
  if (adds.length) { lines.push('// Changed:'); for (const [k,m] of adds) lines.push(isOW ? cellToOWJS(k,m) : cellToJS(k,m)); }
  box.textContent = lines.join('\n');
}

function getDiff() { return document.getElementById('export-box').textContent; }

function getSettlementFilePath() {
  // Map settlementId to its folder name
  const folderMap = {
    frilar_town:  'east_port',
    aethel_keep:  'aethel_keep',
    weavers_deep: 'weavers_deep',
    high_crown:   'high_crown',
    gladehome:    'gladehome',
    sylvanis_root:'sylvanis_root',
    briar_town:   'briar_town',
    harvestfell:  'harvestfell',
    theatfields:  'theatfields',
    dunesedge:    'dunesedge',
    saltwell:     'saltwell',
    wheatstone:   'wheatstone',
  };
  const folder = folderMap[settlementId] || settlementId;
  if (editorMode === 'overworld') return 'worlds/overworld.js';
  if (editorMode === 'interior') return `worlds/settlements/${folder}/interiors/${interiorId}.js`;
  return `worlds/settlements/${folder}/map.js`;
}

function getSettlementFileContent() {
  // ── Overworld ─────────────────────────────────────────────────────────────
  if (editorMode === 'overworld') {
    const cellLines = Object.entries(definedMap)
      .sort(([a],[b]) => { const [ax,ay]=parseKey(a),[bx,by]=parseKey(b); return ay!==by?ay-by:ax-bx; })
      .map(([k,m]) => cellToOWJS(k, m));
    return [
      `// AERDORN — overworld cell definitions`,
      `// Edit in map-editor.html (Overworld mode) and save via Save to GitHub`,
      `(function(){`,
      `  window.WORLD_META = window.WORLD_META || {};`,
      `  function defCell(x,y,type,name=''){window.WORLD_META[\`\${x},\${y}\`]={type,name};}`,
      `  function defLine(pts,type,name){for(const[x,y]of pts)defCell(x,y,type,name);}`,
      `  function defRect(x1,y1,x2,y2,type,name=''){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)window.WORLD_META[\`\${x},\${y}\`]={type,name};}`,
      ``,
      `  // MAP CELLS`,
      ...cellLines,
      `})();`,
      ``,
    ].join('\n');
  }
  const sid = settlementId;
  const s = window.SETTLEMENTS && window.SETTLEMENTS[sid];
  const name       = s ? s.name        : sid;
  const hasWalls   = s ? (s.hasWalls !== false) : true;
  const entryPos   = s ? JSON.stringify(s.entryPos)   : '{x:0,y:2}';
  const owCell     = s ? JSON.stringify(s.overworldCell) : '{x:0,y:0}';
  const desc       = s ? (s.description || '') : '';

  const header = editorMode === 'interior'
    ? `// ${interiorId.toUpperCase()} — interior map`
    : `// ${name.toUpperCase()} — settlement map`;

  const cellLines = Object.entries(definedMap)
    .sort(([a],[b]) => {
      const [ax,ay] = parseKey(a), [bx,by] = parseKey(b);
      return ay !== by ? ay - by : ax - bx;
    })
    .map(([k,m]) => cellToJS(k, m));

  if (editorMode === 'interior') {
    const iid = interiorId;
    return [
      `${header}`,
      `(function(){`,
      `  window.SETTLEMENTS = window.SETTLEMENTS || {};`,
      `  const m = {};`,
      `  function t(x,y,type,name,extra={}){ m[\`\${x},\${y}\`] = Object.assign({type,name},extra); }`,
      ``,
      `  // MAP CELLS`,
      ...cellLines,
      ``,
      `  window.SETTLEMENTS[${JSON.stringify(iid)}] = {`,
      `    map: m,`,
      `    name: ${JSON.stringify(name)},`,
      `    isInterior: true,`,
      `    entryPos: {x:1, y:1},`,
      `  };`,
      `})();`,
      ``,
    ].join('\n');
  }

  return [
    `${header}`,
    `(function(){`,
    `  window.SETTLEMENTS = window.SETTLEMENTS || {};`,
    `  const m = {};`,
    `  function t(x,y,type,name,extra={}){ m[\`\${x},\${y}\`] = Object.assign({type,name},extra); }`,
    `  function rect(x1,y1,x2,y2,type,name,extra={}){`,
    `    for(let x=x1;x<=x2;x++) for(let y=y1;y<=y2;y++) t(x,y,type,name,extra);`,
    `  }`,
    ``,
    `  // MAP CELLS`,
    ...cellLines,
    ``,
    `  window.SETTLEMENTS[${JSON.stringify(sid)}] = {`,
    `    map: m,`,
    `    name: ${JSON.stringify(name)},`,
    `    hasWalls: ${hasWalls},`,
    `    entryPos: ${entryPos},`,
    `    overworldCell: ${owCell},`,
    `    description: ${JSON.stringify(desc)},`,
    `  };`,
    `})();`,
    ``,
  ].join('\n');
}

function doDownload(t,s) {
  const b = new Blob([t], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = (editorMode === 'settlement' ? settlementId : editorMode) + '_' + s + '.js';
  a.click();
}

function doCopy(t) { navigator.clipboard.writeText(t).then(() => statusMsg('Copied!')); }
function statusMsg(msg) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

async function saveToGame() {
  const token = (document.getElementById('github-token')||{}).value || localStorage.getItem('gh_token_map_editor') || '';
  if (!token) {
    statusMsg('Enter GitHub token first.');
    document.getElementById('github-token').focus();
    return;
  }
  // Persist token for this session
  try { localStorage.setItem('gh_token_map_editor', token); } catch(e) {}

  statusMsg('Saving...');
  const path = getSettlementFilePath();
  const content = getSettlementFileContent();
  const b64 = btoa(unescape(encodeURIComponent(content)));

  try {
    // GET current file to retrieve its sha (required for update)
    const getRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    let sha = null;
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    } else if (getRes.status !== 404) {
      throw new Error(`GitHub GET failed: ${getRes.status}`);
    }

    // PUT new content
    const body = {
      message: `Map editor: update ${path}`,
      content: b64,
    };
    if (sha) body.sha = sha;

    const putRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || `GitHub PUT failed: ${putRes.status}`);
    }

    // Update originalMap so diff clears
    for (const [k,v] of Object.entries(definedMap)) originalMap[k] = Object.assign({}, v);
    updateExport();
    statusMsg('Saved to GitHub.');
  } catch(e) {
    statusMsg('Error: ' + e.message);
    console.error('GitHub save error:', e);
  }
}

      });
    }
  } else {

    wrap.style.display='none';
    currentObjStyle=null;

}

function generateBldgGrid(seed){
  if(!MF) return null;
  const{type,w,h,footprint,shape,pattern,styleId,yard}=bldgConfig;
  // Yard strip is always 20px; roof fills the rest
  const yardStrip = 20;
  const rW = (yard==='left'||yard==='right') ? w-yardStrip : w;
  const rH = (yard==='top'||yard==='bottom') ? h-yardStrip : h;
  const rs = MF.ROOF_STYLES.find(s=>s.id===styleId)||MF.ROOF_STYLES[0];
  const{RL,RM,RD,RS} = rs;
  const numCh = rW>=60?2:1;
  const chimneys = MF.autoChimneys ? MF.autoChimneys(rW,rH,numCh) : [];
  const effectiveShape = (shape==='hip'&&rW>rH*1.4)?'ridge':shape;
  let grid = null;
  try{
    if(type==='watchtower')   grid=MF.makeWatchtower(seed);
    else if(type==='windmill')grid=MF.makeWindmill(seed);
    else if(type==='gate')    grid=MF.makeGate(seed);
    else if(type==='castle_wall') grid=MF.makeCastleWall('straight_h',seed);
    else if(type==='dungeon_ent') grid=MF.makeDungeonEntrance(seed);
    else if(type==='ruins')   grid=rs.isThatch?MF.makeThatchRoof(rW,rH,'hip',chimneys,seed):MF.makeRuins(rW,rH,RL,RM,RD,RS,seed,pattern);
    else if(type==='l_shape'||footprint==='L') grid=rs.isThatch?MF.makeIrregularThatch('L',rW,rH,chimneys,seed):MF.makeIrregularRoof('L',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(type==='t_shape'||footprint==='T') grid=rs.isThatch?MF.makeIrregularThatch('T',rW,rH,chimneys,seed):MF.makeIrregularRoof('T',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(type==='irregular'||footprint==='irregular') grid=rs.isThatch?MF.makeIrregularThatch('irregular',rW,rH,chimneys,seed):MF.makeIrregularRoof('irregular',rW,rH,pattern,RL,RM,RD,RS,chimneys,seed);
    else if(rs.isThatch) grid=MF.makeThatchRoof(rW,rH,effectiveShape,chimneys,seed);
    else grid=MF.makeRoofByShape(rW,rH,effectiveShape,pattern,RL,RM,RD,RS,chimneys,seed);
    if(grid&&yard!=='none') grid=MF.composeWithYard(grid,rW,rH,yard,w,h,styleId,seed);
  }catch(e){console.warn('bldg gen error',e);return null;}
  return grid;
}

function updateBldgPreview(){
  const pv = document.getElementById('bldg-preview');
  const pvCtx = pv.getContext('2d');
  pvCtx.clearRect(0,0,pv.width,pv.height);
  pvCtx.fillStyle='#1a1408'; pvCtx.fillRect(0,0,pv.width,pv.height);
  if(!MF||!MF.ROOF_STYLES) return;
  const grid = generateBldgGrid(99999);
  if(!grid) return;
  const gW=grid[0].length, gH=grid.length;
  const scale = Math.min(pv.width/gW, pv.height/gH);
  const dw=gW*scale, dh=gH*scale;
  const tc=document.createElement('canvas'); MF.renderGridToCanvas(grid,tc,1);
  pvCtx.imageSmoothingEnabled=false;
  pvCtx.drawImage(tc,(pv.width-dw)/2,(pv.height-dh)/2,dw,dh);
}

function getToken() {
  return (document.getElementById('github-token')||{}).value || localStorage.getItem('gh_token_map_editor') || '';
}

async function githubGet(path) {
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
    headers: { 'Authorization': `Bearer ${getToken()}` }
  });
  if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
  return res.json();
}

async function githubPut(path, content, sha, message) {
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const body = { message, content: b64 };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.message || `PUT ${path} failed: ${res.status}`); }
  return res.json();
}

async function githubPatch(path, patchFn, message) {
  let sha = null, current = '';
  try {
    const data = await githubGet(path);
    sha = data.sha;
    current = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
  } catch(e) {
    if (!e.message.includes('404')) throw e;
  }
  const patched = patchFn(current);
  if (patched === current) return;
  await githubPut(path, patched, sha, message);
}

async function createSettlement(id, name) {
  const nmStatus = s => document.getElementById('nm-status').textContent = s;
  const wx = parseInt(document.getElementById('nm-wx').value) || 0;
  const wy = parseInt(document.getElementById('nm-wy').value) || 0;
  const hasWalls = document.getElementById('nm-walls').value === 'true';
  const folder = id;

  nmStatus('Creating map.js...');
  const mapContent = `// ${name.toUpperCase()} -- settlement map\n(function(){\n  window.SETTLEMENTS = window.SETTLEMENTS || {};\n  const m = {};\n  function t(x,y,type,name,extra={}){ m[\`\${x},\${y}\`] = Object.assign({type,name},extra); }\n\n  // MAP CELLS -- edit in map-editor.html\n\n  window.SETTLEMENTS[${JSON.stringify(id)}] = {\n    map: m,\n    name: ${JSON.stringify(name)},\n    hasWalls: ${hasWalls},\n    entryPos: {x:0, y:2},\n    overworldCell: {x:${wx}, y:${wy}},\n    description: '',\n  };\n})();\n`;
  await githubPut(`worlds/settlements/${folder}/map.js`, mapContent, null, `New settlement: ${name}`);

  nmStatus('Patching overworld.js...');
  await githubPatch('worlds/overworld.js', c => {
    const line = `  defCell(${wx},${wy},'village',${JSON.stringify(name)});\n`;
    return c.replace('  // -- SETTLEMENT FOOTPRINTS', line + '\n  // -- SETTLEMENT FOOTPRINTS')
            .replace('  // \u2500\u2500 SETTLEMENT FOOTPRINTS', line + '\n  // \u2500\u2500 SETTLEMENT FOOTPRINTS');
  }, `Add ${name} to overworld`);

  nmStatus('Patching index.html...');
  await githubPatch('index.html', c =>
    c.replace('<!-- World data (terrain, overworld, NPCs) -->', `\x3cscript src="worlds/settlements/${folder}/map.js">\x3c/script>\n<!-- World data (terrain, overworld, NPCs) -->`),
    `Add ${name} to index.html`);

  nmStatus('Patching map-editor.html...');
  await githubPatch('map-editor.html', c =>
    c.replace('\x3cscript src="worlds/overworld.js">\x3c/script>', `\x3cscript src="worlds/settlements/${folder}/map.js">\x3c/script>\n\x3cscript src="worlds/overworld.js">\x3c/script>`),
    `Add ${name} to map-editor.html`);

  nmStatus('Done! Reload to edit the new settlement.');
  document.getElementById('new-modal').style.display = 'none';
  statusMsg(`Created ${name} -- reload to edit it.`);
}

async function createInterior(id, name, parentSid) {
  const nmStatus = s => document.getElementById('nm-status').textContent = s;
  const folder = settlementFolder(parentSid);
  const filePath = `worlds/settlements/${folder}/interiors/${id}.js`;

  nmStatus('Creating interior file...');
  const content = `// ${name.toUpperCase()} -- interior map\n(function(){\n  window.SETTLEMENTS = window.SETTLEMENTS || {};\n  const m = {};\n  function t(x,y,type,name,extra={}){ m[\`\${x},\${y}\`] = Object.assign({type,name},extra); }\n\n  for(let x=0;x<=13;x++) for(let y=0;y<=11;y++){\n    const v=(x===0||x===13||y===0||y===11)?{type:'wall',name:'Wall'}:{type:'interior',name:'Floor'};\n    m[\`\${x},\${y}\`]=v;\n  }\n  m['6,0']={type:'door',name:'Entrance'};\n\n  window.SETTLEMENTS[${JSON.stringify(id)}] = {\n    map: m,\n    name: ${JSON.stringify(name)},\n    isInterior: true,\n    entryPos: {x:6, y:1},\n  };\n})();\n`;
  await githubPut(filePath, content, null, `New interior: ${name}`);

  const scriptTag = `\x3cscript src="${filePath}">\x3c/script>`;
  const marker = `worlds/settlements/${folder}/map.js`;

  nmStatus('Patching index.html...');
  await githubPatch('index.html', c => {
    const m = `\x3cscript src="${marker}">\x3c/script>`;
    return c.includes(m) ? c.replace(m, m + '\n' + scriptTag)
      : c.replace('<!-- World data (terrain, overworld, NPCs) -->', scriptTag + '\n<!-- World data (terrain, overworld, NPCs) -->');
  }, `Add ${name} interior to index.html`);

  nmStatus('Patching map-editor.html...');
  await githubPatch('map-editor.html', c => {
    const m = `\x3cscript src="${marker}">\x3c/script>`;
    return c.includes(m) ? c.replace(m, m + '\n' + scriptTag)
      : c.replace('\x3cscript src="worlds/overworld.js">\x3c/script>', scriptTag + '\n\x3cscript src="worlds/overworld.js">\x3c/script>');
  }, `Add ${name} interior to map-editor.html`);

  nmStatus('Done! Reload to edit the interior.');
  document.getElementById('new-modal').style.display = 'none';
  statusMsg(`Created ${name} -- reload to edit it.`);
}

// ── Mouse ──────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{isMouseDown=true;handleMouse(e,true);});
canvas.addEventListener('mousemove',e=>{if(isMouseDown)handleMouse(e,false);});
canvas.addEventListener('mouseup',()=>{isMouseDown=false;});
canvas.addEventListener('mouseleave',()=>{isMouseDown=false;});
function handleMouse(e,isDown){
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
  const px=(e.clientX-rect.left)*sx,py=(e.clientY-rect.top)*sy;
  const{x,y}=canvasToCell(px,py);
  if(!inBounds(x,y))return;
  if(currentTool==='pick'){if(isDown)selectCell(x,y);}
  else if(currentTool==='fill'){if(isDown){floodFill(x,y);selectCell(x,y);}}
  else{
    if(currentLpTab==='building'&&isDown){placeBuilding(x,y);selectCell(x,y);}
    else{applyPaint(x,y);if(isDown)selectCell(x,y);}
  }
}

// ── Tools + keys ───────────────────────────────────────────────
document.querySelectorAll('[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentTool=btn.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));
  });
});
document.getElementById('btn-undo').addEventListener('click',undo);

// Overworld panning
const OW_PAN_STEP = 15;
let owDragging=false, owDragStartX=0, owDragStartY=0, owDragCX=0, owDragCY=0;

function owPan(dx,dy){
  owCX=Math.max(OW_BOUNDS.minX+OW_VIEWPORT_R,Math.min(OW_BOUNDS.maxX-OW_VIEWPORT_R,owCX+dx));
  owCY=Math.max(OW_BOUNDS.minY+OW_VIEWPORT_R,Math.min(OW_BOUNDS.maxY-OW_VIEWPORT_R,owCY+dy));
  document.getElementById('ow-cx').value=owCX;
  document.getElementById('ow-cy').value=owCY;
  tileCache.clear(); loadLayer();
}

// Arrow key panning — attached to document so no focus needed
document.addEventListener('keydown', e => {
  if(editorMode!=='overworld')return;
  if(e.target.matches('input,select,textarea'))return;
  const k=e.key;
  if(k==='ArrowLeft') {e.preventDefault();owPan(-OW_PAN_STEP,0);}
  else if(k==='ArrowRight'){e.preventDefault();owPan(OW_PAN_STEP,0);}
  else if(k==='ArrowUp')  {e.preventDefault();owPan(0,-OW_PAN_STEP);}
  else if(k==='ArrowDown'){e.preventDefault();owPan(0, OW_PAN_STEP);}
});

// Middle-mouse or right-mouse drag to pan
canvas.addEventListener('mousedown', e => {
  if(editorMode==='overworld' && (e.button===1||e.button===2)){
    owDragging=true; owDragStartX=e.clientX; owDragStartY=e.clientY;
    owDragCX=owCX; owDragCY=owCY;
    e.preventDefault();
  }
});
canvas.addEventListener('mousemove', e => {
  if(!owDragging)return;
  const dx=Math.round((e.clientX-owDragStartX)/tileSize);
  const dy=Math.round((e.clientY-owDragStartY)/tileSize);
  owCX=Math.max(OW_BOUNDS.minX+OW_VIEWPORT_R,Math.min(OW_BOUNDS.maxX-OW_VIEWPORT_R,owDragCX-dx));
  owCY=Math.max(OW_BOUNDS.minY+OW_VIEWPORT_R,Math.min(OW_BOUNDS.maxY-OW_VIEWPORT_R,owDragCY-dy));
  document.getElementById('ow-cx').value=owCX;
  document.getElementById('ow-cy').value=owCY;
  tileCache.clear(); loadLayer();
});
canvas.addEventListener('mouseup', e=>{if(e.button===1||e.button===2)owDragging=false;});
canvas.addEventListener('contextmenu', e=>{if(editorMode==='overworld')e.preventDefault();});

// Pan buttons in topbar
document.getElementById('ow-pan-n').addEventListener('click',()=>owPan(0,-OW_PAN_STEP));
document.getElementById('ow-pan-s').addEventListener('click',()=>owPan(0, OW_PAN_STEP));
document.getElementById('ow-pan-w').addEventListener('click',()=>owPan(-OW_PAN_STEP,0));
document.getElementById('ow-pan-e').addEventListener('click',()=>owPan( OW_PAN_STEP,0));
document.getElementById('ow-go').addEventListener('click',()=>{
  const cx=parseInt(document.getElementById('ow-cx').value)||346;
  const cy=parseInt(document.getElementById('ow-cy').value)||556;
  owCX=cx; owCY=cy; tileCache.clear(); loadLayer();
});

document.getElementById('btn-set-start').addEventListener('click', async () => {
  if (!getToken()) { statusMsg('Enter GitHub token first.'); return; }
  const x = owCX, y = owCY;
  statusMsg('Setting start...');
  try {
    await githubPatch('worlds/overworld.js', c =>
      c.replace(/window\.WORLD_START\s*=\s*\{[^}]+\};/, `window.WORLD_START = {x:${x}, y:${y}};`),
      `Set player start to ${x},${y}`
    );
    statusMsg(`Start set to ${x},${y}`);
  } catch(e) {
    statusMsg('Error: ' + e.message);
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();return;}
  const tm={p:'paint',e:'erase',i:'pick',f:'fill'};
  if(tm[e.key]){currentTool=tm[e.key];document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));}
});

// ── Init ───────────────────────────────────────────────────────
function init(){
  if(!window.WORLD_DATA){statusMsg('ERROR: aerdorn.js not loaded');return;}
  if(!window.MapForge){statusMsg('ERROR: mapforge.js not loaded');return;}
  MF=window.MapForge;
  // Restore GitHub token
  const saved = localStorage.getItem('gh_token_map_editor');
  if (saved) { const el = document.getElementById('github-token'); if (el) el.value = saved; }
  buildSettlementList();buildInteriorList();buildTerrainPalette();buildObjPalette();buildBldgPalette();loadLayer();
}
init();
</script>
